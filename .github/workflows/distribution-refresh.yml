name: Distribution Refresh

# Refreshes public/assets/distribution.json (the on-chain ownership-spread
# snapshot behind The Standings). Best-effort: when the public RPC
# rate-limits the runner, previous per-sign values are kept.

on:
  schedule:
    - cron: "31 6 * * 1" # Mondays 06:31 UTC
  workflow_dispatch:

jobs:
  refresh:
    name: Refresh distribution data
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build distribution data
        run: node scripts/build-distribution.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet public/assets/distribution.json; then
            echo "distribution.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/distribution.json
          git commit -m "Refresh distribution data"
          git push
