name: Compatibility Invite Sweep

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-invite-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close expired invitations and prune retained evidence
        env:
          COMPAT_INVITE_SWEEP_SECRET: ${{ secrets.COMPAT_INVITE_SWEEP_SECRET }}
        run: |
          if [ -z "$COMPAT_INVITE_SWEEP_SECRET" ]; then
            echo "Compatibility invitations are not provisioned; no sweep is required."
            exit 0
          fi
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 30 \
            --request POST \
            --header "Authorization: Bearer $COMPAT_INVITE_SWEEP_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            https://zodiacs.org/api/compatibility/invite-sweep
