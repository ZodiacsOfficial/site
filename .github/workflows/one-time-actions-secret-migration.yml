name: One-time Actions Secret Migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Move repository secrets into protected environments
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: secret-migration-production
    timeout-minutes: 10
    steps:
      - name: Require audited workflow release on main
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          REQUIRED_AUDIT_COMMIT: 53d5c1968ca7876b6d50a06009720e1547f258f8
        run: |
          set -euo pipefail
          status=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/${REQUIRED_AUDIT_COMMIT}...main" \
            --jq '.status')
          if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then
            echo "::error::Audit remediation must be merged to main before secret migration."
            exit 1
          fi

      - name: Migrate compatibility sweep secret
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          COMPAT_INVITE_SWEEP_SECRET: ${{ secrets.COMPAT_INVITE_SWEEP_SECRET }}
        run: |
          set -euo pipefail
          set_secret() {
            environment=$1
            name=$2
            value=$3
            if [ -n "$value" ]; then
              printf '%s' "$value" | gh secret set "$name" --repo "$GITHUB_REPOSITORY" --env "$environment"
            elif ! gh secret list --repo "$GITHUB_REPOSITORY" --env "$environment" --json name --jq '.[].name' | grep -Fxq "$name"; then
              echo "::error::Source secret $name is absent and no migrated copy exists in $environment."
              exit 1
            fi
          }
          set_secret compatibility-invite-production COMPAT_INVITE_SWEEP_SECRET "$COMPAT_INVITE_SWEEP_SECRET"

      - name: Migrate daily email secrets
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          DAILY_EMAIL_RECIPIENT_HASH_SECRET: ${{ secrets.DAILY_EMAIL_RECIPIENT_HASH_SECRET }}
          DAILY_EMAIL_TEST_ALLOWLIST: ${{ secrets.DAILY_EMAIL_TEST_ALLOWLIST }}
          DAILY_EMAIL_UNSUBSCRIBE_SECRET: ${{ secrets.DAILY_EMAIL_UNSUBSCRIBE_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_CONTACTS_API_KEY: ${{ secrets.RESEND_CONTACTS_API_KEY }}
          RESEND_DAILY_SEGMENT_ID: ${{ secrets.RESEND_DAILY_SEGMENT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          set_secret() {
            environment=$1
            name=$2
            value=$3
            if [ -n "$value" ]; then
              printf '%s' "$value" | gh secret set "$name" --repo "$GITHUB_REPOSITORY" --env "$environment"
            elif ! gh secret list --repo "$GITHUB_REPOSITORY" --env "$environment" --json name --jq '.[].name' | grep -Fxq "$name"; then
              echo "::error::Source secret $name is absent and no migrated copy exists in $environment."
              exit 1
            fi
          }
          set_secret daily-email-production DAILY_EMAIL_RECIPIENT_HASH_SECRET "$DAILY_EMAIL_RECIPIENT_HASH_SECRET"
          set_secret daily-email-production DAILY_EMAIL_TEST_ALLOWLIST "$DAILY_EMAIL_TEST_ALLOWLIST"
          set_secret daily-email-production DAILY_EMAIL_UNSUBSCRIBE_SECRET "$DAILY_EMAIL_UNSUBSCRIBE_SECRET"
          set_secret daily-email-production RESEND_API_KEY "$RESEND_API_KEY"
          set_secret daily-email-production RESEND_CONTACTS_API_KEY "$RESEND_CONTACTS_API_KEY"
          set_secret daily-email-production RESEND_DAILY_SEGMENT_ID "$RESEND_DAILY_SEGMENT_ID"
          set_secret daily-email-production SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Migrate daily push secrets
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set_secret() {
            environment=$1
            name=$2
            value=$3
            if [ -n "$value" ]; then
              printf '%s' "$value" | gh secret set "$name" --repo "$GITHUB_REPOSITORY" --env "$environment"
            elif ! gh secret list --repo "$GITHUB_REPOSITORY" --env "$environment" --json name --jq '.[].name' | grep -Fxq "$name"; then
              echo "::error::Source secret $name is absent and no migrated copy exists in $environment."
              exit 1
            fi
          }
          set_secret daily-push-production SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          set_secret daily-push-production VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY"

      - name: Migrate weekly digest secrets already provisioned
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          set_secret() {
            environment=$1
            name=$2
            value=$3
            if [ -n "$value" ]; then
              printf '%s' "$value" | gh secret set "$name" --repo "$GITHUB_REPOSITORY" --env "$environment"
            elif ! gh secret list --repo "$GITHUB_REPOSITORY" --env "$environment" --json name --jq '.[].name' | grep -Fxq "$name"; then
              echo "::error::Source secret $name is absent and no migrated copy exists in $environment."
              exit 1
            fi
          }
          set_secret weekly-digest-production SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          set_secret weekly-digest-production RESEND_API_KEY "$RESEND_API_KEY"

      - name: Migrate Preview smoke secret
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          set_secret() {
            environment=$1
            name=$2
            value=$3
            if [ -n "$value" ]; then
              printf '%s' "$value" | gh secret set "$name" --repo "$GITHUB_REPOSITORY" --env "$environment"
            elif ! gh secret list --repo "$GITHUB_REPOSITORY" --env "$environment" --json name --jq '.[].name' | grep -Fxq "$name"; then
              echo "::error::Source secret $name is absent and no migrated copy exists in $environment."
              exit 1
            fi
          }
          set_secret preview-smoke-production VERCEL_AUTOMATION_BYPASS_SECRET "$VERCEL_AUTOMATION_BYPASS_SECRET"

      - name: Verify destinations and remove repository-wide copies
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          assert_main_only_environment() {
            environment=$1
            read -r protected custom < <(
              gh api "repos/$GITHUB_REPOSITORY/environments/$environment" \
                --jq '[.deployment_branch_policy.protected_branches, .deployment_branch_policy.custom_branch_policies] | @tsv'
            )
            if [ "$protected" != "false" ] || [ "$custom" != "true" ]; then
              echo "::error::Protected environment $environment is not restricted to custom branch policies."
              exit 1
            fi

            read -r policy_count exact_main_count < <(
              gh api "repos/$GITHUB_REPOSITORY/environments/$environment/deployment-branch-policies?per_page=100" \
                --jq '[.total_count, ([.branch_policies[] | select(.type == "branch" and .name == "main")] | length)] | @tsv'
            )
            if [ "$policy_count" -ne 1 ] || [ "$exact_main_count" -ne 1 ]; then
              echo "::error::Protected environment $environment must allow exactly the main branch."
              exit 1
            fi
          }

          protected_environments=(
            account-cleanup-production
            compatibility-invite-production
            database-backup-production
            daily-email-production
            daily-push-production
            weekly-digest-production
            preview-smoke-production
            secret-migration-production
          )
          for environment in "${protected_environments[@]}"; do
            assert_main_only_environment "$environment"
          done

          require_secret() {
            environment=$1
            name=$2
            if ! gh secret list --repo "$GITHUB_REPOSITORY" --env "$environment" --json name --jq '.[].name' | grep -Fxq "$name"; then
              echo "::error::Protected environment $environment is missing $name; repository secrets were not removed."
              exit 1
            fi
          }

          require_secret compatibility-invite-production COMPAT_INVITE_SWEEP_SECRET
          daily_names=(
            DAILY_EMAIL_RECIPIENT_HASH_SECRET
            DAILY_EMAIL_TEST_ALLOWLIST
            DAILY_EMAIL_UNSUBSCRIBE_SECRET
            RESEND_API_KEY
            RESEND_CONTACTS_API_KEY
            RESEND_DAILY_SEGMENT_ID
            SUPABASE_SERVICE_ROLE_KEY
          )
          for name in "${daily_names[@]}"; do
            require_secret daily-email-production "$name"
          done
          require_secret daily-push-production SUPABASE_SERVICE_ROLE_KEY
          require_secret daily-push-production VAPID_PRIVATE_KEY
          require_secret weekly-digest-production SUPABASE_SERVICE_ROLE_KEY
          require_secret weekly-digest-production RESEND_API_KEY
          require_secret preview-smoke-production VERCEL_AUTOMATION_BYPASS_SECRET

          repository_secrets=$(gh secret list --repo "$GITHUB_REPOSITORY" --json name --jq '.[].name')
          repository_names=(
            COMPAT_INVITE_SWEEP_SECRET
            DAILY_EMAIL_RECIPIENT_HASH_SECRET
            DAILY_EMAIL_TEST_ALLOWLIST
            DAILY_EMAIL_UNSUBSCRIBE_SECRET
            DIGEST_UNSUBSCRIBE_SECRET
            RESEND_API_KEY
            RESEND_CONTACTS_API_KEY
            RESEND_DAILY_SEGMENT_ID
            SUPABASE_SERVICE_ROLE_KEY
            VAPID_PRIVATE_KEY
            VERCEL_AUTOMATION_BYPASS_SECRET
          )
          for name in "${repository_names[@]}"; do
            if grep -Fxq "$name" <<<"$repository_secrets"; then
              gh secret delete "$name" --repo "$GITHUB_REPOSITORY"
            fi
          done

          remaining=$(gh secret list --repo "$GITHUB_REPOSITORY" --json name --jq 'length')
          if [ "$remaining" -ne 0 ]; then
            echo "::error::$remaining repository-level Actions secret(s) remain."
            exit 1
          fi
          gh secret delete GH_ADMIN_TOKEN --repo "$GITHUB_REPOSITORY" --env secret-migration-production
          echo "All Actions secrets are now scoped to exact-main protected environments."
