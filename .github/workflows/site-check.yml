name: Site Check

on:
  push:
    branches:
      - main
  # Stacked packet PRs target the preceding packet branch, so every PR base
  # must receive the same regression gates as main.
  pull_request:
  workflow_dispatch:
    inputs:
      scope_base:
        description: Commit SHA or ref to compare for the protected-scope guard
        required: true
        type: string

jobs:
  build-check:
    name: Build & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Phase 1 protected-scope guard
        env:
          PHASE1_SCOPE_BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope_base || github.event.pull_request.base.sha || github.event.before }}
        run: npm run test:phase1:scope

      - name: Install
        run: npm ci

      - name: Install pinned Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Validate registry JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('public/registry/zodiacs.registry.json', 'utf8'))"

      - name: Check for stale repo or bridge wording
        run: |
          ! grep -RInE 'Symbiosis|ZodiacS(DK)|diasmal[[:digit:]]{3}|zodiacs-org/sdk' public/sdk public/registry README.md CLAUDE.md DESIGNER_HANDOFF.md

      - name: Wing language stays in the wing
        # Crypto/market vocabulary must never appear on the new consumer
        # surfaces. Registry routes are exempt by path; the Registry-only
        # islands (WalletChart, RegistryAura, islands/aura/) are exempt by
        # name; the privacy pages carry the legally required wallet/provider
        # disclosures (CLAUDE.md carve-out). The rest of src stays covered.
        run: |
          ! grep -RInE --exclude-dir=registry --exclude-dir=aura --exclude-dir=privacy --exclude=WalletChart.tsx --exclude=RegistryAura.tsx 'Solana|DexScreener|Jupiter swap|ERC-20|SPL record|memecoin|market cap' src/pages src/components src/islands src/content src/layouts

      - name: Voice — banned tells stay out of the copy
        # The smug vocabulary CLAUDE.md bans on new surfaces, enforced
        # over every content file and template the agents touch.
        run: |
          ! grep -RIniE 'done properly|computed properly|shows? (its|their) work|like a human( wrote it)?|no mush|not vibes|speaks human|como es debido|sin paja' src/content src/pages src/components src/islands

      - name: Authorship stays transparent
        run: |
          ! grep -RInE 'Rowan Vale|about/#editor([^i]|$)|"@type"[[:space:]]*:[[:space:]]*"Person"' src

      - name: Verify daily editorial package
        run: npm run editorial:daily:verify

      - name: Replay 30 daily editions
        run: npm run editorial:daily:replay

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run check

      - name: Engine accuracy vectors
        run: npm test

      - name: Phase 1 exact-width acceptance evidence
        run: npm run test:phase1:evidence

      - name: Weekly digest smoke
        run: npm run digest:weekly -- --dry-run --fixture --week-start 2026-07-13 --limit 1

      - name: Link & artifact integrity over dist
        run: node scripts/check-dist.mjs

      - name: Phase 2 sky-events publication drive
        run: OUT_DIR=tests/visual/artifacts/events npm run test:events:browser

      - name: Today SSR and personalization
        run: npm run test:today:browser

      - name: Horoscope templates, SSR, and responsive behavior
        run: OUT_DIR=tests/visual/artifacts/horoscope-program npm run test:horoscopes:browser

      - name: Existing compatibility regression drive
        run: OUT_DIR=tests/visual/artifacts/compatibility npm run test:compatibility:browser

      - name: Existing Registry selector regression drive
        run: OUT_DIR=tests/visual/artifacts/registry npm run test:registry-selector:browser

      - name: Phase 1 mobile frame cadence
        run: npm run test:phase1:frames

      - name: Structured data validation
        run: npm run schema:check

      - name: Bundle size & engine isolation gates
        run: node scripts/report-bundles.mjs --fail

      - name: Visual regression
        run: npm run test:visual

      - name: Lighthouse performance budgets
        run: npm run test:lighthouse

      - name: Foreign-origin widget integration
        run: npm run test:widgets:browser

      - name: Widget Lighthouse thresholds
        run: npm run test:widgets:lighthouse

      - name: Upload Phase 1 browser and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-browser-performance-${{ github.run_id }}
          path: tests/visual/artifacts/
          if-no-files-found: ignore
          retention-days: 90

  legacy-drift:
    name: Legacy wing drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Committed wing HTML must match what the builders produce from
      # sources (build-app resolves the pinned local @babel/standalone,
      # so this job runs fully offline).
      - name: Rebuild wing output from sources
        run: |
          node scripts/build-app.mjs
          node scripts/build-sign-pages.mjs
          node scripts/build-archive.mjs

      - name: Drift gate
        run: git diff --exit-code -- public/

  phase3-delivery-sql:
    name: Phase 3 delivery SQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: PostgreSQL 17 migration and concurrency gates
        run: bash scripts/test-phase3-delivery-sql.sh

  phase3-post-chart-drive:
    name: Phase 3 post-chart drive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Browser acceptance drive
        run: npm run test:phase3:post-chart

  phase3-push-drive:
    name: Phase 3 push drive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_WEB_PUSH_ENABLED: "1"
      PUSH_ENABLED: "1"
      PUBLIC_VAPID_KEY: AQIDBA
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Build (push flags on, fixture key only)
        run: npm run build

      - name: Today returning layout (push flags on)
        run: npm run test:today:browser

      - name: Browser acceptance drive
        run: npm run test:phase3:push

  aura-drive:
    # The flag-on browser acceptance suite for Registry Aura: docket honesty,
    # Alignment grammar, share privacy, wallet lifecycle, forced colors, and
    # the offline/error escapes. The holdings endpoint is mocked in-page, so
    # the RPC URLs only need to satisfy build-time validation.
    name: Registry Aura drive
    runs-on: ubuntu-latest
    env:
      PUBLIC_REGISTRY_AURA_ENABLED: "1"
      SOLANA_RPC_URL: https://aura-ci.invalid/rpc
      BASE_RPC_URL: https://aura-ci.invalid/base
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Build (feature flag on)
        run: npm run build

      - name: Browser acceptance drive
        run: npm run test:aura:browser

      - name: Upload regenerated proofs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aura-drive-proofs
          path: docs/acceptance/registry-aura/
          if-no-files-found: ignore
