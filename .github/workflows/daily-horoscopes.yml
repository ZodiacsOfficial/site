name: Daily Sky

# Shortly after midnight UTC, recompute src/data/daily.json — the
# positions, moon phase, and same-day events the horoscope pages render
# as their "Today, computed" section. The commit triggers the normal
# Vercel deploy. The builder is deterministic for a given date, so a
# re-run on the same day is a no-op.

on:
  schedule:
    - cron: "15 0 * * *" # daily, 00:15 UTC
  workflow_dispatch:

concurrency:
  group: daily-sky
  cancel-in-progress: false

jobs:
  daily:
    name: Compute today's sky
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute today
        run: node scripts/build-daily.mjs

      - name: Commit if changed
        run: |
          FILE="src/data/daily.json"
          if git diff --quiet -- "$FILE"; then
            echo "$FILE unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Daily sky: $(node -p "require('./src/data/daily.json').date")"
          git push
