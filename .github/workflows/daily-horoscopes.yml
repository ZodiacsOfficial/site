name: Daily Sky

# Shortly after midnight UTC, recompute src/data/daily.json — the
# positions, moon phase, and same-day events the horoscope pages render
# as their "Today, computed" section. The commit triggers the normal
# Vercel deploy. The builder is deterministic for a given date, so a
# re-run on the same day is a no-op.

on:
  schedule:
    - cron: "15 0 * * *" # daily, 00:15 UTC
  workflow_dispatch:

concurrency:
  group: daily-sky
  cancel-in-progress: false

jobs:
  daily:
    name: Compute today's sky
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute today
        run: node scripts/build-daily.mjs

      - name: Commit if changed
        id: commit
        run: |
          FILE="src/data/daily.json"
          if git diff --quiet -- "$FILE"; then
            echo "$FILE unchanged"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Daily sky: $(node -p "require('./src/data/daily.json').date")"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Notify IndexNow
        if: steps.commit.outputs.committed == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir } from 'node:fs/promises';

          const keyFiles = (await readdir('public')).filter((name) => /^d21e17e6-.*\.txt$/.test(name));
          if (keyFiles.length !== 1) throw new Error(`Expected one IndexNow key file, found ${keyFiles.length}`);
          const keyFile = keyFiles[0];
          const key = (await readFile(`public/${keyFile}`, 'utf8')).trim();
          if (keyFile !== `${key}.txt`) throw new Error('IndexNow key filename and body do not match');

          const signs = ['aries', 'taurus', 'gemini', 'cancer', 'leo', 'virgo', 'libra', 'scorpio', 'sagittarius', 'capricorn', 'aquarius', 'pisces'];
          const paths = [
            '/', '/horoscopes/', ...signs.map((sign) => `/horoscopes/${sign}/`),
            '/transits/', '/feeds/', '/feeds/daily-sky.xml', '/feeds/horoscopes.xml',
          ];
          const response = await fetch('https://api.indexnow.org/indexnow', {
            method: 'POST',
            headers: { 'content-type': 'application/json; charset=utf-8' },
            body: JSON.stringify({
              host: 'zodiacs.org',
              key,
              keyLocation: `https://zodiacs.org/${keyFile}`,
              urlList: paths.map((path) => `https://zodiacs.org${path}`),
            }),
          });
          const body = await response.text();
          console.log(`IndexNow: ${response.status}${body ? ` — ${body}` : ''}`);
          if (![200, 202].includes(response.status)) process.exit(1);
          NODE
