name: Daily Sky

# Shortly after midnight UTC, compute one facts + copy + provenance package.
# Nothing is pushed until deterministic verification and a 30-day replay pass.

on:
  schedule:
    - cron: "15 0 * * *" # daily, 00:15 UTC
  workflow_dispatch:

concurrency:
  group: daily-sky
  cancel-in-progress: false

jobs:
  daily:
    name: Compute today's sky
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve explicit UTC target
        run: echo "TARGET_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Compute today
        run: |
          node scripts/build-daily.mjs "$TARGET_DATE"
          npm run editorial:daily:build -- --date "$TARGET_DATE"
          npm run editorial:horoscopes:build -- --date "$TARGET_DATE"

      - name: Verify publication package
        run: |
          npm run editorial:daily:verify -- --date "$TARGET_DATE"
          npm run editorial:horoscopes:verify

      - name: Replay 30 publication days
        run: npm run editorial:daily:replay -- --through "$TARGET_DATE"

      - name: Commit if changed
        id: commit
        run: |
          FILES=(
            "src/data/daily.json"
            "src/data/daily-publication.json"
            "src/data/daily-publication-manifest.json"
            "src/data/horoscope-program.json"
          )
          if git diff --quiet -- "${FILES[@]}"; then
            echo "Daily publication package unchanged"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "Daily sky: $(node -p "require('./src/data/daily.json').date")"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Notify IndexNow
        if: steps.commit.outputs.committed == 'true'
        env:
          LIVE_DAILY_URL: https://zodiacs.org/data/daily-publication.json
        run: |
          node scripts/verify-live-daily.mjs --url "$LIVE_DAILY_URL" --timeout 600
          node --input-type=module <<'NODE'
          import { readFile, readdir } from 'node:fs/promises';

          const keyFiles = (await readdir('public')).filter((name) => /^d21e17e6-.*\.txt$/.test(name));
          if (keyFiles.length !== 1) throw new Error(`Expected one IndexNow key file, found ${keyFiles.length}`);
          const keyFile = keyFiles[0];
          const key = (await readFile(`public/${keyFile}`, 'utf8')).trim();
          if (keyFile !== `${key}.txt`) throw new Error('IndexNow key filename and body do not match');

          const signs = ['aries', 'taurus', 'gemini', 'cancer', 'leo', 'virgo', 'libra', 'scorpio', 'sagittarius', 'capricorn', 'aquarius', 'pisces'];
          const paths = [
            '/', '/today/', '/horoscopes/',
            ...signs.flatMap((sign) => [
              `/horoscopes/${sign}/`,
              `/horoscopes/${sign}/tomorrow/`,
              `/horoscopes/${sign}/weekly/`,
              `/horoscopes/${sign}/monthly/`,
              `/horoscopes/${sign}/love/`,
              `/horoscopes/${sign}/career/`,
              `/horoscopes/${sign}/2027/`,
              `/feeds/horoscopes/${sign}.xml`,
            ]),
            '/transits/', '/feeds/', '/feeds/daily-sky.xml', '/feeds/horoscopes.xml',
          ];
          const response = await fetch('https://api.indexnow.org/indexnow', {
            method: 'POST',
            headers: { 'content-type': 'application/json; charset=utf-8' },
            body: JSON.stringify({
              host: 'zodiacs.org',
              key,
              keyLocation: `https://zodiacs.org/${keyFile}`,
              urlList: paths.map((path) => `https://zodiacs.org${path}`),
            }),
          });
          const body = await response.text();
          console.log(`IndexNow: ${response.status}${body ? ` — ${body}` : ''}`);
          if (![200, 202].includes(response.status)) process.exit(1);
          NODE
