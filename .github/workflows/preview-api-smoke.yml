name: Preview API Smoke

on:
  deployment_status:

permissions:
  contents: read

jobs:
  preview-api-smoke:
    name: Preview API smoke
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview' &&
      github.event.deployment.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the trusted default branch
        uses: actions/checkout@v6
        with:
          # deployment_status runs in the base-repo context with secrets, and
          # Vercel also deploys fork PRs — so the smoke script must come from
          # a trusted ref, never from the deployed revision, or a fork could
          # rewrite it to exfiltrate the bypass secret. The deployed SHA is
          # only ever used as the probe TARGET (via the deployment URL), not
          # as code. A PR that changes the smoke script exercises the new
          # version only after it merges to main.
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe the Preview functions
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          # Optional for public previews; required when Vercel Deployment
          # Protection intercepts automation before it reaches the app.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/smoke-preview-functions.mjs
