name: Capture catalogue visual evidence

on:
  push:
    branches:
      - codex/catalogue-emotional-redesign

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install pinned Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Capture exact-width evidence
        run: npm run test:phase1:acceptance

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-phase1-evidence
          path: docs/acceptance/phase1/screenshots/
          if-no-files-found: error
          retention-days: 1
