<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08090C" />
  <meta name="color-scheme" content="dark" />
  <title>Zodiacs.org — The oldest story, reinvented.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ──────────────────────────────────────────────────────────────
       Zodiacs.org — Mobile landing
       Aesthetic: dark museum luxury × ancient astronomical artifact
       × private banking terminal.
       ────────────────────────────────────────────────────────────── */

    :root {
      --bg:            #08090C;
      --bg-2:          #0B0D12;
      --surface:       #10131A;
      --surface-2:     #161A23;
      --surface-3:     #1C2230;

      --hair:          rgba(201, 169, 97, 0.10);
      --hair-2:        rgba(201, 169, 97, 0.22);
      --hair-3:        rgba(201, 169, 97, 0.42);
      --hair-stone:    rgba(232, 227, 212, 0.06);

      --gold:          #C9A961;
      --gold-bright:   #DEC07A;
      --gold-deep:     #8E7541;
      --bronze:        #6B5638;

      --ink:           #E8E3D4;
      --ink-2:         #C9C4B5;
      --ink-dim:       #908B7C;
      --ink-mute:      #65604F;

      --stone:         #2A2E37;
      --celestial:     #4A6D94;
      --celestial-dim: #2C415A;

      --serif:         'Cormorant Garamond', 'EB Garamond', Georgia, Cambria, 'Times New Roman', serif;
      --mono:          'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Monaco, Consolas, monospace;

      --ease:          cubic-bezier(.22,.61,.36,1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--serif);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(120% 60% at 50% -10%, rgba(201,169,97,0.06), transparent 60%),
        radial-gradient(120% 80% at 50% 110%, rgba(74,109,148,0.05), transparent 60%),
        var(--bg);
    }

    img, svg { display: block; max-width: 100%; }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    /* ── App shell ─────────────────────────────────────────────── */

    .zd {
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      overflow-x: hidden;
    }

    @media (min-width: 720px) {
      .zd { max-width: 460px; box-shadow: 0 0 0 1px var(--hair) inset; }
    }

    /* ── Micro-typography utilities ────────────────────────────── */

    .label {
      font-family: var(--mono);
      font-weight: 400;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }
    .label--gold { color: var(--gold); }
    .label--mute { color: var(--ink-mute); }

    .mono   { font-family: var(--mono); font-feature-settings: "tnum" 1, "ss01" 1; }
    .serif  { font-family: var(--serif); }
    .italic { font-style: italic; }

    .hair { height: 1px; background: var(--hair); width: 100%; border: 0; margin: 0; }
    .hair--gold { background: linear-gradient(90deg, transparent, var(--hair-3) 18%, var(--hair-3) 82%, transparent); }
    .hair--vert { width: 1px; height: 100%; background: var(--hair); }

    .dot {
      display: inline-block; width: 3px; height: 3px;
      background: var(--gold); border-radius: 50%; vertical-align: middle;
      margin: 0 8px 2px; opacity: 0.7;
    }

    /* ── Header ────────────────────────────────────────────────── */

    .hdr {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      height: 56px; padding: 0 20px;
      background: rgba(8, 9, 12, 0.78);
      backdrop-filter: saturate(140%) blur(14px);
      -webkit-backdrop-filter: saturate(140%) blur(14px);
      border-bottom: 1px solid var(--hair);
    }
    .hdr__mark {
      font-family: var(--serif);
      font-size: 16px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .hdr__mark .dim { color: var(--gold); font-weight: 500; }
    .hdr__mark .sep { color: var(--ink-mute); margin: 0 4px; }
    .hdr__nav {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-2);
      padding: 8px 10px 8px 14px;
      border-left: 1px solid var(--hair-2);
    }

    /* ── Hero ──────────────────────────────────────────────────── */

    .hero {
      padding: 28px 20px 32px;
      position: relative;
    }
    .hero::before {
      content: "";
      position: absolute; inset: 0;
      background: radial-gradient(70% 50% at 50% 0%, rgba(201,169,97,0.08), transparent 65%);
      pointer-events: none;
    }
    .hero__eyebrow {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 22px;
    }
    .hero__eyebrow .line {
      flex: 0 0 24px; height: 1px; background: var(--hair-3);
    }
    .hero__headline {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 42px;
      line-height: 1.04;
      letter-spacing: -0.005em;
      color: var(--ink);
      margin: 0 0 18px;
    }
    .hero__headline .it {
      font-style: italic;
      color: var(--gold-bright);
      font-weight: 400;
    }
    .hero__sub {
      font-family: var(--serif);
      font-size: 16.5px;
      line-height: 1.55;
      color: var(--ink-2);
      max-width: 34ch;
      margin: 0 0 28px;
      font-weight: 400;
    }
    .hero__cta {
      display: flex; flex-direction: column; gap: 12px;
      margin-bottom: 36px;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      height: 52px;
      padding: 0 22px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--hair-3);
      box-shadow:
        inset 0 1px 0 rgba(222, 192, 122, 0.10),
        inset 0 -1px 0 rgba(0, 0, 0, 0.4);
      transition: border-color 240ms var(--ease), color 240ms var(--ease), background 240ms var(--ease);
    }
    .btn:hover { border-color: var(--gold); color: var(--gold-bright); }
    .btn--primary { color: var(--gold-bright); }
    .btn--ghost {
      height: 44px;
      border: 0;
      box-shadow: none;
      color: var(--ink-2);
      letter-spacing: 0.24em;
      position: relative;
    }
    .btn--ghost::after {
      content: ""; position: absolute; left: 22px; right: 22px; bottom: 12px;
      height: 1px; background: var(--hair-2);
    }
    .btn .arr { color: var(--gold); }

    /* ── Featured card ─────────────────────────────────────────── */

    .card {
      position: relative;
      background:
        radial-gradient(120% 60% at 50% 0%, rgba(201,169,97,0.06), transparent 55%),
        radial-gradient(120% 100% at 50% 100%, rgba(74,109,148,0.04), transparent 60%),
        linear-gradient(180deg, #14171F 0%, #0C0E14 100%);
      border: 1px solid var(--hair-3);
      box-shadow:
        inset 0 1px 0 rgba(222,192,122,0.14),
        inset 0 -1px 0 rgba(0,0,0,0.5),
        0 18px 40px -22px rgba(0,0,0,0.7),
        0 0 0 1px rgba(0,0,0,0.4);
    }
    .card__inner {
      padding: 18px;
      border: 1px solid var(--hair);
      margin: 8px;
    }
    .card__head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    .card__corner {
      position: absolute;
      width: 10px; height: 10px;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.55;
    }
    .card__corner--tl { top: 4px; left: 4px;   border-width: 1px 0 0 1px; }
    .card__corner--tr { top: 4px; right: 4px;  border-width: 1px 1px 0 0; }
    .card__corner--bl { bottom: 4px; left: 4px;  border-width: 0 0 1px 1px; }
    .card__corner--br { bottom: 4px; right: 4px; border-width: 0 1px 1px 0; }

    .glyph-stage {
      position: relative;
      height: 200px;
      display: grid; place-items: center;
      margin: 4px 0 6px;
    }
    .glyph-stage::before {
      content: "";
      position: absolute; inset: 0;
      background: radial-gradient(50% 40% at 50% 50%, rgba(201,169,97,0.18), transparent 70%);
      pointer-events: none;
    }
    .glyph {
      font-family: var(--serif);
      font-size: 168px;
      line-height: 1;
      color: var(--gold-bright);
      text-shadow:
        0 0 28px rgba(201,169,97,0.25),
        0 0 1px rgba(255,236,180,0.6);
      transition: opacity 320ms var(--ease), transform 320ms var(--ease);
    }
    .glyph--enter { opacity: 0; transform: translateY(6px) scale(0.985); filter: blur(2px); }

    .card__name {
      font-family: var(--serif);
      font-weight: 400;
      font-style: italic;
      font-size: 36px;
      line-height: 1;
      text-align: center;
      color: var(--ink);
      margin: 4px 0 8px;
    }
    .card__meta {
      text-align: center;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }
    .card__meta .g { color: var(--gold); }
    .card__archetype {
      text-align: center;
      font-family: var(--serif);
      font-style: italic;
      font-size: 15px;
      color: var(--ink-2);
      margin-top: 10px;
      letter-spacing: 0.01em;
    }

    .card__prev {
      margin-top: 22px;
      border-top: 1px solid var(--hair);
      border-bottom: 1px solid var(--hair);
      padding: 14px 4px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    }
    .card__prev > div { display: flex; flex-direction: column; gap: 6px; }
    .card__prev > div + div { border-left: 1px solid var(--hair); padding-left: 16px; }
    .card__prev .val {
      font-family: var(--mono);
      font-size: 17px;
      color: var(--ink);
      letter-spacing: 0.02em;
    }
    .card__prev .val .ccy { color: var(--ink-dim); margin-right: 6px; font-size: 11px; letter-spacing: 0.2em; }
    .card__prev .val.up   { color: var(--gold-bright); }
    .card__prev .val.down { color: #B07A6E; }

    .card__bio {
      margin-top: 16px;
      font-family: var(--serif);
      font-style: italic;
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--ink-2);
    }

    /* ── Section frames ────────────────────────────────────────── */

    .sec { padding: 56px 20px; position: relative; }
    .sec__head {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 22px;
    }
    .sec__head .line { flex: 1; height: 1px; background: var(--hair); }
    .sec__no {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--ink-mute);
      letter-spacing: 0.22em;
    }
    .sec__title {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--gold);
    }

    /* ── Selector strip ────────────────────────────────────────── */

    .strip-wrap {
      padding-top: 6px;
      padding-bottom: 8px;
      border-top: 1px solid var(--hair);
      border-bottom: 1px solid var(--hair);
      background:
        linear-gradient(180deg, rgba(201,169,97,0.04), transparent 60%),
        var(--bg-2);
    }
    .strip-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px 10px;
    }
    .strip {
      display: flex;
      gap: 8px;
      padding: 4px 20px 18px;
      overflow-x: auto;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
    }
    .strip::-webkit-scrollbar { display: none; }
    .strip__item {
      flex: 0 0 auto;
      width: 64px; height: 84px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--hair);
      scroll-snap-align: start;
      transition:
        border-color 280ms var(--ease),
        color 280ms var(--ease),
        background 280ms var(--ease),
        box-shadow 280ms var(--ease),
        transform 280ms var(--ease);
      position: relative;
    }
    .strip__item .sym {
      font-family: var(--serif);
      font-size: 26px;
      color: var(--ink-2);
      line-height: 1;
      transition: color 280ms var(--ease), text-shadow 280ms var(--ease);
    }
    .strip__item .tk {
      font-family: var(--mono);
      font-size: 8.5px;
      letter-spacing: 0.2em;
      color: var(--ink-mute);
      transition: color 280ms var(--ease);
    }
    .strip__item.is-active {
      border-color: var(--gold);
      background: linear-gradient(180deg, rgba(201,169,97,0.08), transparent 70%), var(--surface-2);
      box-shadow:
        inset 0 1px 0 rgba(222,192,122,0.18),
        0 0 0 1px rgba(201,169,97,0.18),
        0 0 24px -6px rgba(201,169,97,0.35);
    }
    .strip__item.is-active .sym { color: var(--gold-bright); text-shadow: 0 0 12px rgba(201,169,97,0.45); }
    .strip__item.is-active .tk  { color: var(--gold); }
    .strip__item::after {
      content: ""; position: absolute; left: 8px; right: 8px; bottom: 4px;
      height: 1px; background: var(--hair);
      opacity: 0;
    }
    .strip__item.is-active::after { opacity: 1; background: var(--hair-3); }

    /* ── Museum label / detail panel ───────────────────────────── */

    .detail {
      border: 1px solid var(--hair-2);
      background:
        linear-gradient(180deg, rgba(201,169,97,0.03), transparent 40%),
        var(--surface);
      padding: 22px 20px 24px;
    }
    .detail__name {
      font-family: var(--serif);
      font-size: 30px;
      font-style: italic;
      font-weight: 400;
      color: var(--ink);
      margin: 4px 0 4px;
      line-height: 1;
    }
    .detail__ticker {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.26em;
      color: var(--gold);
    }
    .detail__symbol {
      float: right;
      font-family: var(--serif);
      font-size: 44px;
      line-height: 1;
      color: var(--gold-bright);
      margin-left: 12px;
      text-shadow: 0 0 18px rgba(201,169,97,0.3);
    }
    .detail__rows {
      margin-top: 18px;
      border-top: 1px solid var(--hair);
    }
    .detail__row {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 11px 0;
      border-bottom: 1px solid var(--hair);
      gap: 12px;
    }
    .detail__row .k {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }
    .detail__row .v {
      font-family: var(--serif);
      font-size: 16px;
      color: var(--ink);
      text-align: right;
      font-style: italic;
    }
    .detail__row .v.mono {
      font-family: var(--mono);
      font-style: normal;
      font-size: 12.5px;
      color: var(--ink-2);
      letter-spacing: 0.04em;
    }
    .detail__bio {
      margin-top: 18px;
      padding: 16px 18px;
      border: 1px solid var(--hair);
      border-left: 1px solid var(--hair-3);
      font-family: var(--serif);
      font-style: italic;
      font-size: 15.5px;
      line-height: 1.6;
      color: var(--ink-2);
      background: rgba(255,255,255,0.01);
    }

    /* ── Market data strip ─────────────────────────────────────── */

    .mkt {
      border: 1px solid var(--hair-2);
      background: var(--surface);
      padding: 18px 4px 6px;
    }
    .mkt__head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 16px 14px;
      border-bottom: 1px solid var(--hair);
    }
    .mkt__head .pulse {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.22em; color: var(--ink-dim);
      text-transform: uppercase;
    }
    .pulse .dot-live {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--gold-bright);
      box-shadow: 0 0 8px var(--gold);
      animation: pulse 2.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50%      { opacity: 1; }
    }
    .mkt__grid {
      display: grid; grid-template-columns: 1fr 1fr;
    }
    .mkt__cell {
      padding: 14px 16px;
      border-bottom: 1px solid var(--hair);
    }
    .mkt__cell:nth-child(odd)  { border-right: 1px solid var(--hair); }
    .mkt__cell:last-child,
    .mkt__cell:nth-last-child(2):nth-child(odd) { border-bottom: 0; }
    .mkt__k {
      font-family: var(--mono); font-size: 9.5px;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--ink-mute);
      margin-bottom: 6px;
    }
    .mkt__v {
      font-family: var(--mono);
      font-size: 15px;
      color: var(--ink);
      letter-spacing: 0.02em;
    }
    .mkt__v .ccy { color: var(--ink-dim); margin-right: 6px; font-size: 10px; letter-spacing: 0.2em; }
    .mkt__v.up   { color: var(--gold-bright); }
    .mkt__v.down { color: #B07A6E; }
    .mkt__foot {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px 8px;
      font-family: var(--mono); font-size: 9.5px;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--ink-mute);
    }

    /* ── Philosophy ────────────────────────────────────────────── */

    .phil {
      padding: 64px 20px 56px;
      background:
        radial-gradient(80% 60% at 50% 0%, rgba(74,109,148,0.06), transparent 60%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      border-top: 1px solid var(--hair);
      border-bottom: 1px solid var(--hair);
    }
    .phil__sup {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 22px;
    }
    .phil__sup .line { flex: 1; height: 1px; background: var(--hair); }
    .phil__body {
      font-family: var(--serif);
      font-size: 20px;
      line-height: 1.55;
      color: var(--ink);
      letter-spacing: -0.002em;
    }
    .phil__body .dc {
      font-family: var(--serif);
      float: left;
      font-size: 64px;
      line-height: 0.85;
      color: var(--gold-bright);
      padding: 6px 12px 0 0;
      font-style: italic;
    }
    .phil__sig {
      margin-top: 28px;
      display: flex; justify-content: space-between; align-items: baseline;
      font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.22em; color: var(--ink-mute);
      text-transform: uppercase;
    }

    /* ── Twelve signs catalog ──────────────────────────────────── */

    .cat {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .cat__item {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--hair);
      padding: 14px 12px 12px;
      text-align: left;
      transition: border-color 280ms var(--ease), background 280ms var(--ease), box-shadow 280ms var(--ease);
      display: flex; flex-direction: column; gap: 8px;
      min-height: 168px;
    }
    .cat__item:hover { border-color: var(--hair-2); }
    .cat__item.is-active {
      border-color: var(--gold);
      background: linear-gradient(180deg, rgba(201,169,97,0.05), transparent 60%), var(--surface-2);
      box-shadow: 0 0 0 1px rgba(201,169,97,0.2), 0 0 24px -8px rgba(201,169,97,0.35);
    }
    .cat__no {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.22em;
      color: var(--ink-mute);
    }
    .cat__sym {
      font-family: var(--serif);
      font-size: 44px;
      line-height: 1;
      color: var(--gold-bright);
      text-shadow: 0 0 12px rgba(201,169,97,0.25);
      margin: 2px 0 0;
    }
    .cat__name {
      font-family: var(--serif);
      font-style: italic;
      font-size: 22px;
      color: var(--ink);
      line-height: 1;
      margin: 4px 0 0;
    }
    .cat__tk {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.22em;
      color: var(--gold);
    }
    .cat__meta {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.14em;
      color: var(--ink-mute);
      text-transform: uppercase;
      margin-top: 4px;
    }
    .cat__price {
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid var(--hair);
      display: flex; justify-content: space-between; align-items: baseline;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-2);
    }
    .cat__price .ch.up   { color: var(--gold-bright); }
    .cat__price .ch.down { color: #B07A6E; }

    /* ── Closing ───────────────────────────────────────────────── */

    .close {
