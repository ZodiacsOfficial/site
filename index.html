<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08090C" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Zodiacs.org. Twelve cultural assets for a digital era. The oldest symbolic language of civilization, recast as scarce digital signs for a new generation of collectors." />
  <meta property="og:title" content="Zodiacs.org. The oldest story, reinvented." />
  <meta property="og:description" content="Twelve signs. Thousands of years of cultural memory. Recast as scarce digital symbols." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Zodiacs.org · The oldest story, reinvented.</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2308090C'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='Cormorant Garamond, Georgia, serif' font-style='italic' font-size='42' fill='%23DEC07A'%3EZ%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ──────────────────────────────────────────────────────────────
       Zodiacs.org — Mobile landing
       Aesthetic: dark museum luxury × ancient astronomical artifact
       × private banking terminal.
       ────────────────────────────────────────────────────────────── */

    :root {
      --bg:            #08090C;
      --bg-2:          #0B0D12;
      --surface:       #10131A;
      --surface-2:     #161A23;
      --surface-3:     #1C2230;

      --hair:          rgba(201, 169, 97, 0.10);
      --hair-2:        rgba(201, 169, 97, 0.22);
      --hair-3:        rgba(201, 169, 97, 0.42);
      --hair-stone:    rgba(232, 227, 212, 0.06);

      --gold:          #C9A961;
      --gold-bright:   #DEC07A;
      --gold-deep:     #8E7541;
      --bronze:        #6B5638;

      /* Sage-green system status — restrained so it coexists with gold */
      --live:          #6FAE7C;

      /* Softened from #E8E3D4 — skill rule: softer contrast on premium UI */
      --ink:           #DCD7C7;
      --ink-2:         #BDB8A9;
      --ink-dim:       #8A8576;
      --ink-mute:      #5F5A4A;

      --stone:         #2A2E37;
      --celestial:     #4A6D94;
      --celestial-dim: #2C415A;

      --serif:         'Cormorant Garamond', 'EB Garamond', Georgia, Cambria, 'Times New Roman', serif;
      --mono:          'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Monaco, Consolas, monospace;

      /* Apple-tier ease curve (cubic-bezier(0.32,0.72,0,1)) — heavier, fluid, decelerating */
      --ease:          cubic-bezier(0.32, 0.72, 0, 1);
      --ease-soft:     cubic-bezier(0.22, 1,    0.36, 1);

      /* Disciplined z-index scale */
      --z-grain:   1;
      --z-base:    10;
      --z-nav:     40;
      --z-overlay: 60;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--serif);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }

    body {
      min-height: 100dvh;
      background:
        radial-gradient(120% 60% at 50% -10%, rgba(201,169,97,0.07), transparent 60%),
        radial-gradient(120% 80% at 50% 110%, rgba(201,169,97,0.03), transparent 60%),
        var(--bg);
    }

    /* Sticky-safe anchor navigation — header sits at top:12px + 12px margin */
    [id] { scroll-margin-top: 96px; }

    img, svg { display: block; max-width: 100%; }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    /* Focus rings — accessibility audit rule */
    :focus-visible {
      outline: 1px solid var(--gold);
      outline-offset: 3px;
      box-shadow: 0 0 0 4px rgba(201,169,97,0.12);
      transition: box-shadow 200ms var(--ease);
    }
    :focus:not(:focus-visible) { outline: 0; }

    /* Skip link — keyboard accessibility */
    .skip {
      position: absolute; left: -9999px; top: 0;
      background: var(--surface-2); color: var(--gold);
      padding: 10px 16px;
      font-family: var(--mono); font-size: 11px;
      letter-spacing: 0.22em; text-transform: uppercase;
      border: 1px solid var(--hair-3);
      z-index: var(--z-overlay);
    }
    .skip:focus { left: 12px; top: 12px; }

    /* Screen-reader-only utility */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Fixed grain overlay — breaks digital flatness without breaking perf */
    .grain {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: var(--z-grain);
      opacity: 0.045;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.85  0 0 0 0 0.5  0 0 0 0.85 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* Constellation pinpoints — fixed, restrained, museum-not-cosmic. Below content. */
    .stars {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: var(--z-grain);
      opacity: 0.5;
      mix-blend-mode: screen;
      background-image:
        radial-gradient(1px 1px at 8% 12%,   rgba(232,227,212,0.7), transparent 60%),
        radial-gradient(1px 1px at 22% 38%,  rgba(201,169,97,0.6),  transparent 60%),
        radial-gradient(1px 1px at 71% 8%,   rgba(232,227,212,0.45), transparent 60%),
        radial-gradient(1px 1px at 88% 24%,  rgba(201,169,97,0.55),  transparent 60%),
        radial-gradient(1px 1px at 44% 62%,  rgba(232,227,212,0.4), transparent 60%),
        radial-gradient(1px 1px at 92% 71%,  rgba(232,227,212,0.5), transparent 60%);
      background-attachment: fixed;
    }

    /* ── App shell ─────────────────────────────────────────────── */

    .zd {
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      z-index: var(--z-base);
      /* `clip` (vs `hidden`) doesn't establish a scroll context — keeps sticky working */
      overflow-x: clip;
    }

    @media (min-width: 720px) {
      .zd { max-width: 460px; box-shadow: 0 0 0 1px var(--hair) inset; }
    }

    /* ── Micro-typography utilities ────────────────────────────── */

    .label {
      font-family: var(--mono);
      font-weight: 400;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }
    .label--gold { color: var(--gold); }
    .label--mute { color: var(--ink-mute); }

    .mono   { font-family: var(--mono); font-feature-settings: "tnum" 1, "ss01" 1; }
    .serif  { font-family: var(--serif); }
    .italic { font-style: italic; }

    .hair { height: 1px; background: var(--hair); width: 100%; border: 0; margin: 0; }
    .hair--gold { background: linear-gradient(90deg, transparent, var(--hair-3) 18%, var(--hair-3) 82%, transparent); }
    .hair--vert { width: 1px; height: 100%; background: var(--hair); }

    .dot {
      display: inline-block; width: 3px; height: 3px;
      background: var(--gold); border-radius: 50%; vertical-align: middle;
      margin: 0 8px 2px; opacity: 0.7;
    }

    /* ── Header — floating island pill (no edge-to-edge sticky) ── */

    .hdr-wrap {
      position: sticky; top: 12px; z-index: var(--z-nav);
      display: flex; justify-content: center;
      pointer-events: none;
      padding: 0 16px;
      margin-top: 14px;
    }
    .hdr {
      pointer-events: auto;
      display: inline-flex; align-items: center; justify-content: space-between;
      gap: 18px;
      height: 48px;
      padding: 0 6px 0 18px;
      background: rgba(11, 13, 18, 0.72);
      backdrop-filter: saturate(160%) blur(18px);
      -webkit-backdrop-filter: saturate(160%) blur(18px);
      border: 1px solid var(--hair-2);
      box-shadow:
        inset 0 1px 0 rgba(222,192,122,0.10),
        inset 0 -1px 0 rgba(0,0,0,0.4),
        0 8px 28px -12px rgba(0,0,0,0.6),
        0 0 0 1px rgba(0,0,0,0.35);
      transition: border-color 420ms var(--ease), background 420ms var(--ease);
      min-width: min(360px, 92vw);
    }
    .hdr__mark {
      font-family: var(--serif);
      font-size: 15px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
      white-space: nowrap;
    }
    .hdr__mark .dim { color: var(--gold); font-weight: 500; }
    .hdr__mark .sep { color: var(--ink-mute); margin: 0 4px; }

    /* Button-in-button: collection chip with nested arrow bezel */
    .hdr__nav {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-2);
      height: 36px;
      padding: 0 6px 0 14px;
      border-left: 1px solid var(--hair-2);
      text-decoration: none;
      transition: color 320ms var(--ease);
    }
    .hdr__nav:hover { color: var(--gold-bright); }
    .hdr__nav .chip {
      display: inline-grid; place-items: center;
      width: 26px; height: 26px;
      border: 1px solid var(--hair-2);
      background: rgba(201,169,97,0.05);
      color: var(--gold);
      font-size: 11px;
      transition: transform 420ms var(--ease), border-color 320ms var(--ease), background 320ms var(--ease);
    }
    .hdr__nav:hover .chip {
      transform: translate(2px, -1px);
      border-color: var(--gold);
      background: rgba(201,169,97,0.10);
    }

    /* ── Hero ──────────────────────────────────────────────────── */

    .hero {
      padding: 56px 20px 64px;
      position: relative;
    }
    .hero::before {
      content: "";
      position: absolute; inset: -40px 0 0 0;
      background:
        radial-gradient(60% 40% at 50% 0%, rgba(201,169,97,0.10), transparent 65%),
        radial-gradient(80% 35% at 30% 12%, rgba(201,169,97,0.04), transparent 70%);
      pointer-events: none;
    }

    /* Eyebrow pill badge — rule: microscopic pill before H1 */
    .hero__eyebrow {
      display: inline-flex; align-items: center; gap: 10px;
      margin-bottom: 28px;
      padding: 6px 12px 6px 8px;
      background: rgba(201,169,97,0.05);
      border: 1px solid var(--hair-2);
      border-radius: 999px;
    }
    .hero__eyebrow .pulse-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--live);
      flex: 0 0 auto;
      box-shadow:
        0 0 0 0 rgba(111, 174, 124, 0.55);
      animation: live-pulse 2.4s cubic-bezier(0.32, 0.72, 0, 1) infinite;
    }
    /* Box-shadow only — never transform — so the dot stays still while
       the ring expands outward. transform: scale on a flex child can
       read as vertical bob even though it's center-pivoted. */
    @keyframes live-pulse {
      0%   { box-shadow: 0 0 0 0   rgba(111, 174, 124, 0.55), 0 0 4px 0 rgba(111, 174, 124, 0.0); }
      55%  { box-shadow: 0 0 0 7px rgba(111, 174, 124, 0.0),  0 0 10px 2px rgba(111, 174, 124, 0.42); }
      100% { box-shadow: 0 0 0 0   rgba(111, 174, 124, 0.0),  0 0 4px 0 rgba(111, 174, 124, 0.0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero__eyebrow .pulse-dot { animation: none; box-shadow: 0 0 6px rgba(111, 174, 124, 0.55); }
    }
    .hero__headline {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 48px;
      line-height: 0.98;
      letter-spacing: -0.012em;
      color: var(--ink);
      margin: 0 0 22px;
      text-wrap: balance;
    }
    .hero__headline .it {
      font-style: italic;
      color: var(--gold-bright);
      font-weight: 400;
    }
    .hero__sub {
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1.55;
      color: var(--ink-2);
      max-width: 34ch;
      margin: 0 0 36px;
      font-weight: 400;
      text-wrap: pretty;
    }
    .hero__cta {
      display: flex; flex-direction: column; gap: 12px;
      margin-bottom: 48px;
    }
    /* Below-card variant — sits between FeaturedCard and DetailPanel.
       Inherits flex layout from .hero__cta but supplies its own gutter
       so it doesn't double up with the card's bottom margin. */
    .hero__cta--below {
      padding: 32px 20px 8px;
      margin: 0;
    }
    /* Primary CTA — button-in-button architecture per skill rules */
    .btn {
      position: relative;
      display: inline-flex; align-items: center; justify-content: space-between; gap: 10px;
      height: 56px;
      padding: 0 8px 0 22px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--hair-3);
      text-decoration: none;
      box-shadow:
        inset 0 1px 0 rgba(222, 192, 122, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.5);
      transition:
        border-color 420ms var(--ease),
        color 420ms var(--ease),
        background 420ms var(--ease),
        transform 220ms var(--ease);
      will-change: transform;
    }
    .btn:hover { border-color: var(--gold); color: var(--gold-bright); }
    .btn:active { transform: scale(0.985); }
    .btn--primary { color: var(--gold-bright); }
    .btn--primary::before {
      content: "";
      position: absolute; inset: 4px;
      border: 1px solid var(--hair);
      pointer-events: none;
      transition: border-color 420ms var(--ease);
    }
    .btn--primary:hover::before { border-color: var(--hair-2); }

    /* Nested arrow bezel — never bare next to text */
    .btn .arr {
      display: inline-grid; place-items: center;
      width: 40px; height: 40px;
      background: rgba(201,169,97,0.06);
      border: 1px solid var(--hair-2);
      color: var(--gold);
      font-size: 13px;
      transition:
        transform 420ms var(--ease),
        background 320ms var(--ease),
        border-color 320ms var(--ease);
    }
    .btn:hover .arr {
      transform: translate(3px, -1px);
      background: rgba(201,169,97,0.14);
      border-color: var(--gold);
    }

    /* Tertiary text link variant — reduces 1-filled+1-ghost monotony */
    .btn--ghost {
      height: 48px;
      padding: 0 22px;
      border: 0;
      box-shadow: none;
      color: var(--ink-2);
      letter-spacing: 0.24em;
      position: relative;
      justify-content: flex-start;
      gap: 12px;
    }
    .btn--ghost::after {
      content: ""; position: absolute; left: 22px; right: 22px; bottom: 8px;
      height: 1px; background: var(--hair-2);
      transition: background 320ms var(--ease), right 420ms var(--ease);
    }
    .btn--ghost:hover { color: var(--gold-bright); }
    .btn--ghost:hover::after { background: var(--gold); right: 16px; }

    /* ── Featured card ─────────────────────────────────────────── */

    .card {
      position: relative;
      background:
        radial-gradient(120% 60% at 50% 0%, rgba(201,169,97,0.06), transparent 55%),
        radial-gradient(120% 100% at 50% 100%, rgba(74,109,148,0.04), transparent 60%),
        linear-gradient(180deg, #14171F 0%, #0C0E14 100%);
      border: 1px solid var(--hair-3);
      box-shadow:
        inset 0 1px 0 rgba(222,192,122,0.14),
        inset 0 -1px 0 rgba(0,0,0,0.5),
        0 18px 40px -22px rgba(0,0,0,0.7),
        0 0 0 1px rgba(0,0,0,0.4);
    }
    .card__inner {
      padding: 18px;
      border: 1px solid var(--hair);
      margin: 8px;
    }
    .card__head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    .card__corner {
      position: absolute;
      width: 10px; height: 10px;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.55;
    }
    .card__corner--tl { top: 4px; left: 4px;   border-width: 1px 0 0 1px; }
    .card__corner--tr { top: 4px; right: 4px;  border-width: 1px 1px 0 0; }
    .card__corner--bl { bottom: 4px; left: 4px;  border-width: 0 0 1px 1px; }
    .card__corner--br { bottom: 4px; right: 4px; border-width: 0 1px 1px 0; }

    /* Museum-plinth stage: tall, restrained, no gold "spotlight" glow.
       Figure bottom-aligns to a hairline plinth and casts a soft dark
       contact shadow into the card surface. */
    .glyph-stage {
      position: relative;
      height: 340px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin: 8px 0 14px;
      padding: 12px 0 26px;
      isolation: isolate;
      overflow: hidden;
    }
    /* Soft floor fade — the lower portion of the stage darkens almost
       imperceptibly, anchoring the figure. */
    .glyph-stage::before {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 42%;
      background:
        linear-gradient(180deg,
          transparent 0%,
          rgba(0,0,0,0.10) 60%,
          rgba(0,0,0,0.22) 100%);
      pointer-events: none;
      z-index: 0;
    }
    /* Plinth hairline — single gold thread the figure stands on. */
    .glyph-stage::after {
      content: "";
      position: absolute;
      left: 14%; right: 14%; bottom: 18px;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(201,169,97,0.55) 22%,
        rgba(201,169,97,0.55) 78%,
        transparent 100%);
      pointer-events: none;
      z-index: 0;
    }
    .glyph-stage .nugget {
      position: relative;
      z-index: 1;
      width: auto;
      height: auto;
      max-width: 88%;
      max-height: 100%;
      object-fit: contain;
      /* Bronze-tinted contact shadow reads warmer on dark surface than pure black. */
      filter:
        drop-shadow(0 6px 10px rgba(20, 14, 6, 0.55))
        drop-shadow(0 2px 4px rgba(36, 26, 12, 0.65));
      transition: opacity 320ms var(--ease), transform 320ms var(--ease), filter 320ms var(--ease);
    }
    .glyph--enter { opacity: 0; transform: translateY(6px) scale(0.985); filter: blur(2px); }

    .card__name {
      font-family: var(--serif);
      font-weight: 400;
      font-style: italic;
      font-size: 36px;
      line-height: 1;
      text-align: center;
      color: var(--ink);
      margin: 4px 0 8px;
      text-wrap: balance;
    }
    .card__meta {
      text-align: center;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }
    .card__meta .g { color: var(--gold); }
    .card__archetype {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      margin-top: 12px;
    }
    .card__archetype-text {
      font-family: var(--serif);
      font-style: italic;
      font-size: 15px;
      color: var(--ink-2);
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .card__archetype-rule {
      height: 1px; width: 28px;
      background: linear-gradient(90deg, transparent, rgba(201,169,97,0.45));
    }
    .card__archetype-rule + .card__archetype-text + .card__archetype-rule {
      background: linear-gradient(90deg, rgba(201,169,97,0.45), transparent);
    }

    .card__prev {
      margin-top: 22px;
      border-top: 1px solid var(--hair);
      border-bottom: 1px solid var(--hair);
      padding: 14px 4px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    }
    .card__prev > div { display: flex; flex-direction: column; gap: 6px; }
    .card__prev > div + div { border-left: 1px solid var(--hair); padding-left: 16px; }
    .card__prev .val {
      font-family: var(--mono);
      font-size: 17px;
      color: var(--ink);
      letter-spacing: 0.02em;
    }
    .card__prev .val .ccy { color: var(--ink-dim); margin-right: 6px; font-size: 11px; letter-spacing: 0.2em; }
    .card__prev .val.up   { color: var(--gold-bright); }
    .card__prev .val.down { color: #B07A6E; }

    .card__bio {
      margin-top: 16px;
      font-family: var(--serif);
      font-style: italic;
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--ink-2);
    }

    /* ── Section frames ────────────────────────────────────────── */

    /* Macro-whitespace: 56px → 88px (~py-22 mobile, breathes heavily) */
    .sec { padding: 88px 20px 96px; position: relative; }
    .sec__head {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 28px;
    }
    .sec__head .line { flex: 1; height: 1px; background: var(--hair); }
    .sec__no {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--ink-mute);
      letter-spacing: 0.22em;
    }
    .sec__title {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--gold);
    }

    /* ── Selector strip — line-art glyphs, halo on active ─────── */

    .strip-wrap {
      padding: 22px 0 22px;
      border-top: 1px solid var(--hair);
      border-bottom: 1px solid var(--hair);
      background:
        linear-gradient(180deg,

    const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];

    function FeaturedCard({ sign, animKey }) {

    // Auto-advance cadence (ms) — must match the CSS @keyframes
    // `strip-countdown` duration. Keep them in lockstep or the visual
    // ring desyncs from the actual hand-off.
    const SELECTOR_CYCLE_MS = 4000;

    function Selector({ active, setActive }) {
      const ref = useRef(null);
      const mounted = useRef(false);
      const [autoplay, setAutoplay] = useState(true);

      // Honour OS-level reduced-motion: disable autoplay outright.
      useEffect(() => {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (mq.matches) setAutoplay(false);
        const onChange = () => mq.matches && setAutoplay(false);
        mq.addEventListener?.('change', onChange);
        return () => mq.removeEventListener?.('change', onChange);
      }, []);

      // Pause autoplay while the tab is backgrounded.
      const [tabVisible, setTabVisible] = useState(
        typeof document !== 'undefined' ? document.visibilityState === 'visible' : true
      );
      useEffect(() => {
        const onVis = () => setTabVisible(document.visibilityState === 'visible');
        document.addEventListener('visibilitychange', onVis);
        return () => document.removeEventListener('visibilitychange', onVis);
      }, []);

      // Pause autoplay when the strip scrolls off-screen, so the
      // featured card doesn't quietly change underneath a user who
      // has scrolled down to read the museum label or catalog.
      const [stripVisible, setStripVisible] = useState(true);
      useEffect(() => {
        const node = ref.current?.parentElement; // .strip-wrap
        if (!node || typeof IntersectionObserver === 'undefined') return;
        const io = new IntersectionObserver(
          ([entry]) => setStripVisible(entry.isIntersecting),
          { threshold: 0.4 }
        );
        io.observe(node);
        return () => io.disconnect();
      }, []);

      // Drive the rotation. Each active ticker change resets the timer,
      // so the countdown ring always starts fresh on the new sign.
      const running = autoplay && tabVisible && stripVisible;
      useEffect(() => {
        if (!running) return;
        const id = setTimeout(() => {
          const idx = SIGNS.findIndex(s => s.ticker === active);
          const next = SIGNS[(idx + 1) % SIGNS.length].ticker;
          setActive(next);
        }, SELECTOR_CYCLE_MS);
        return () => clearTimeout(id);
      }, [active, running, setActive]);

      // First manual interaction stops autoplay for the session. Both
      // direct taps and drag/scroll of the strip count as "user took
      // control", and from then on the page respects the user's pick.
      const stopAutoplay = () => setAutoplay(false);

      useEffect(() => {
        const strip = ref.current;
        if (!strip) return;
        const handler = () => stopAutoplay();
        strip.addEventListener('pointerdown', handler, { once: true, passive: true });
        strip.addEventListener('wheel',       handler, { once: true, passive: true });
        return () => {
          strip.removeEventListener('pointerdown', handler);
          strip.removeEventListener('wheel',       handler);
        };
      }, []);

      // Horizontal-only centering — never touch page vertical scroll.
      useEffect(() => {
        const strip = ref.current;
        const el = strip?.querySelector('.is-active');
        if (!strip || !el) return;
        const target =
          el.offsetLeft - strip.clientWidth / 2 + el.clientWidth / 2;
        strip.scrollTo({
          left: Math.max(0, target),
          behavior: mounted.current ? 'smooth' : 'auto',
        });
        mounted.current = true;
      }, [active]);

      const handlePick = (ticker) => {
        stopAutoplay();
        setActive(ticker);
      };

      return (
        <section
          className={'strip-wrap' + (running ? ' is-autoplay' : '')}
          aria-label="Zodiac selector"
        >
          <div className="strip" ref={ref} role="tablist">
            {SIGNS.map(s => {
              const isActive = active === s.ticker;
              return (
                <button
                  key={s.ticker}
                  className={'strip__glyph' + (isActive ? ' is-active' : '')}
                  onClick={() => handlePick(s.ticker)}
                  role="tab"
                  aria-pressed={isActive}
                  aria-label={s.name}
                  title={s.name}
                >
                  <img
                    src={`assets/icons/${s.name.toLowerCase()}.png`}
                    alt=""
                    loading="lazy"
                    decoding="async"
                  />
                </button>
              );
            })}
          </div>
          <div className="strip__sub">
            <span className="chev" aria-hidden="true">‹</span>
            <span>
              {running ? 'Auto-rotating · tap to pin' : 'Scroll or drag to explore'}
            </span>
            <span className="chev" aria-hidden="true">›</span>
          </div>
        </section>
      );
    }

    function DetailPanel({ sign, animKey }) {

          </div>
        </section>
      );

    // ──────────────────────────────────────────────────────────────

    function Zodiacs() {
      const [activeTicker, setActiveTicker] = useState('LEO');
      const sign = useMemo(
        () => SIGNS.find(s => s.ticker === activeTicker) ?? SIGNS[0],

      return (
        <>
          <a href="#main" className="skip">Skip to content</a>
          <div className="stars" aria-hidden="true" />
          <div className="grain" aria-hidden="true" />
          <div className="zd">

            <Hero
              sign={sign}

              active={activeTicker}
              setActive={setActiveTicker}
            />
            <HeroActions />
            <DetailPanel sign={sign} animKey={activeTicker} />
            <MarketStrip sign={sign} animKey={activeTicker} />
            <Philosophy />
            <CatalogGrid active={activeTicker} setActive={setActiveTicker} />
            <Closing />
            <Footer />
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Zodiacs />);
  </script>
