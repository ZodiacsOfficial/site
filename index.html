  <style>
    /* ──────────────────────────────────────────────────────────────
       Zodiacs.org — Mobile landing
       Aesthetic: dark museum luxury × ancient astronomical artifact
       × private banking terminal.
       ────────────────────────────────────────────────────────────── */

    :root {
      --bg:            #08090C;
      --bg-2:          #0B0D12;
      --surface:       #10131A;
      --surface-2:     #161A23;
      --surface-3:     #1C2230;

      --hair:          rgba(201, 169, 97, 0.10);
      --hair-2:        rgba(201, 169, 97, 0.22);
      --hair-3:        rgba(201, 169, 97, 0.42);
      --hair-stone:    rgba(232, 227, 212, 0.06);

      --gold:          #C9A961;
      --gold-bright:   #DEC07A;
      --gold-deep:     #8E7541;
      --bronze:        #6B5638;

      /* Sage-green system status — restrained so it coexists with gold */
      --live:          #6FAE7C;

      /* Softened from #E8E3D4 — skill rule: softer contrast on premium UI */
      --ink:           #DCD7C7;
      --ink-2:         #BDB8A9;
      --ink-dim:       #8A8576;
      --ink-mute:      #5F5A4A;

      --stone:         #2A2E37;
      --celestial:     #4A6D94;
      --celestial-dim: #2C415A;

      --serif:         'Cormorant Garamond', 'EB Garamond', Georgia, Cambria, 'Times New Roman', serif;
      --mono:          'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Monaco, Consolas, monospace;

      /* Apple-tier ease curve (cubic-bezier(0.32,0.72,0,1)) — heavier, fluid, decelerating */
      --ease:          cubic-bezier(0.32, 0.72, 0, 1);
      --ease-soft:     cubic-bezier(0.22, 1,    0.36, 1);

      /* Disciplined z-index scale */
      --z-grain:   1;
      --z-base:    10;
      --z-nav:     40;
      --z-overlay: 60;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--serif);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }

    body {
      min-height: 100dvh;
      background:
        radial-gradient(120% 60% at 50% -10%, rgba(201,169,97,0.07), transparent 60%),
        radial-gradient(120% 80% at 50% 110%, rgba(201,169,97,0.03), transparent 60%),
        var(--bg);
    }

    /* Sticky-safe anchor navigation — header sits at top:12px + 12px margin */
    [id] { scroll-margin-top: 96px; }

    img, svg { display: block; max-width: 100%; }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    /* Focus rings — accessibility audit rule */
    :focus-visible {
      outline: 1px solid var(--gold);
      outline-offset: 3px;
      box-shadow: 0 0 0 4px rgba(201,169,97,0.12);
      transition: box-shadow 200ms var(--ease);
    }
    :focus:not(:focus-visible) { outline: 0; }

    /* Skip link — keyboard accessibility */
    .skip {
      position: absolute; left: -9999px; top: 0;
      background: var(--surface-2); color: var(--gold);
      padding: 10px 16px;
      font-family: var(--mono); font-size: 11px;
      letter-spacing: 0.22em; text-transform: uppercase;
      border: 1px solid var(--hair-3);
      z-index: var(--z-overlay);
    }
    .skip:focus { left: 12px; top: 12px; }

    /* Screen-reader-only utility */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Fixed grain overlay — breaks digital flatness without breaking perf */
    .grain {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: var(--z-grain);
      opacity: 0.045;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.85  0 0 0 0 0.5  0 0 0 0.85 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* Constellation pinpoints — fixed, restrained, museum-not-cosmic. Below content. */
    .stars {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: var(--z-grain);
      opacity: 0.5;
      mix-blend-mode: screen;
      background-image:
        radial-gradient(1px 1px at 8% 12%,   rgba(232,227,212,0.7), transparent 60%),
        radial-gradient(1px 1px at 22% 38%,  rgba(201,169,97,0.6),  transparent 60%),
        radial-gradient(1px 1px at 71% 8%,   rgba(232,227,212,0.45), transparent 60%),
        radial-gradient(1px 1px at 88% 24%,  rgba(201,169,97,0.55),  transparent 60%),
        radial-gradient(1px 1px at 44% 62%,  rgba(232,227,212,0.4), transparent 60%),
        radial-gradient(1px 1px at 92% 71%,  rgba(232,227,212,0.5), transparent 60%);
      background-attachment: fixed;
    }

    /* ── App shell ─────────────────────────────────────────────── */

    .zd {
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      z-index: var(--z-base);
      /* `clip` (vs `hidden`) doesn't establish a scroll context — keeps sticky working */
      overflow-x: clip;
    }

    @media (min-width: 720px) {
      .zd { max-width: 460px; box-shadow: 0 0 0 1px var(--hair) inset; }
    }

    /* ── Micro-typography utilities ────────────────────────────── */

    .label {
      font-family: var(--mono);
      font-weight: 400;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }
    .label--gold { color: var(--gold); }
    .label--mute { color: var(--ink-mute); }

    .mono   { font-family: var(--mono); font-feature-settings: "tnum" 1, "ss01" 1; }
    .serif  { font-family: var(--serif); }
    .italic { font-style: italic; }

    .hair { height: 1px; background: var(--hair); width: 100%; border: 0; margin: 0; }
    .hair--gold { background: linear-gradient(90deg, transparent, var(--hair-3) 18%, var(--hair-3) 82%, transparent); }
    .hair--vert { width: 1px; height: 100%; background: var(--hair); }

    .dot {
      display: inline-block; width: 3px; height: 3px;
      background: var(--gold); border-radius: 50%; vertical-align: middle;
      margin: 0 8px 2px; opacity: 0.7;
    }

    /* ── Header — floating island pill (no edge-to-edge sticky) ── */

    .hdr-wrap {
      position: sticky; top: 12px; z-index: var(--z-nav);
      display: flex; justify-content: center;
      pointer-events: none;
      padding: 0 16px;
      margin-top: 14px;
    }
    .hdr {
      pointer-events: auto;
      display: inline-flex; align-items: center; justify-content: space-between;
      gap: 18px;
      height: 48px;
      padding: 0 6px 0 18px;
      background: rgba(11, 13, 18, 0.72);
      backdrop-filter: saturate(160%) blur(18px);
      -webkit-backdrop-filter: saturate(160%) blur(18px);
      border: 1px solid var(--hair-2);
      box-shadow:
        inset 0 1px 0 rgba(222,192,122,0.10),
        inset 0 -1px 0 rgba(0,0,0,0.4),
        0 8px 28px -12px rgba(0,0,0,0.6),
        0 0 0 1px rgba(0,0,0,0.35);
      transition: border-color 420ms var(--ease), background 420ms var(--ease);
      min-width: min(360px, 92vw);
    }
    .hdr__mark {
      font-family: var(--serif);
      font-size: 15px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
      white-space: nowrap;
    }
    .hdr__mark .dim { color: var(--gold); font-weight: 500; }
    .hdr__mark .sep { color: var(--ink-mute); margin: 0 4px; }

    /* Button-in-button: collection chip with nested arrow bezel */
    .hdr__nav {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-2);
      height: 36px;
      padding: 0 6px 0 14px;
      border-left: 1px solid var(--hair-2);
      text-decoration: none;
      transition: color 320ms var(--ease);
    }
    .hdr__nav:hover { color: var(--gold-bright); }
    .hdr__nav .chip {
      display: inline-grid; place-items: center;
      width: 26px; height: 26px;
      border: 1px solid var(--hair-2);
      background: rgba(201,169,97,0.05);
      color: var(--gold);
      font-size: 11px;
      transition: transform 420ms var(--ease), border-color 320ms var(--ease), background 320ms var(--ease);
    }
    .hdr__nav:hover .chip {
      transform: translate(2px, -1px);
      border-color: var(--gold);
      background: rgba(201,169,97,0.10);
    }

    /* ── Hero ──────────────────────────────────────────────────── */

    .hero {
      padding: 56px 20px 64px;
      position: relative;
    }
    .hero::before {
      content: "";
      position: absolute; inset: -40px 0 0 0;
      background:
        radial-gradient(60% 40% at 50% 0%, rgba(201,169,97,0.10), transparent 65%),
        radial-gradient(80% 35% at 30% 12%, rgba(201,169,97,0.04), transparent 70%);
      pointer-events: none;
    }

    /* Eyebrow pill badge — rule: microscopic pill before H1 */
    .hero__eyebrow {
      display: inline-flex; align-items: center; gap: 10px;
      margin-bottom: 28px;
      padding: 6px 12px 6px 8px;
      background: rgba(201,169,97,0.05);
      border: 1px solid var(--hair-2);
      border-radius: 999px;
    }
    .hero__eyebrow .pulse-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--live);
      flex: 0 0 auto;
      box-shadow:
        0 0 0 0 rgba(111, 174, 124, 0.55);
      animation: live-pulse 2.4s cubic-bezier(0.32, 0.72, 0, 1) infinite;
    }
    /* Box-shadow only — never transform — so the dot stays still while
       the ring expands outward. transform: scale on a flex child can
       read as vertical bob even though it's center-pivoted. */
    @keyframes live-pulse {
      0%   { box-shadow: 0 0 0 0   rgba(111, 174, 124, 0.55), 0 0 4px 0 rgba(111, 174, 124, 0.0); }
      55%  { box-shadow: 0 0 0 7px rgba(111, 174, 124, 0.0),  0 0 10px 2px rgba(111, 174, 124, 0.42); }
      100% { box-shadow: 0 0 0 0   rgba(111, 174, 124, 0.0),  0 0 4px 0 rgba(111, 174, 124, 0.0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero__eyebrow .pulse-dot { animation: none; box-shadow: 0 0 6px rgba(111, 174, 124, 0.55); }
    }
    .hero__headline {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 48px;
      line-height: 0.98;
      letter-spacing: -0.012em;
      color: var(--ink);
      margin: 0 0 22px;
      text-wrap: balance;
    }
    .hero__headline .it {
      font-style: italic;
      color: var(--gold-bright);
      font-weight: 400;
    }
    .hero__sub {
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1.55;
      color: var(--ink-2);
      max-width: 34ch;
      margin: 0 0 36px;
      font-weight: 400;
      text-wrap: pretty;
    }
    .hero__cta {
      display: flex; flex-direction: column; gap: 12px;
      margin-bottom: 48px;
    }
    /* Below-card variant — sits between FeaturedCard and DetailPanel.
       Inherits flex layout from .hero__cta but supplies its own gutter
       so it doesn't double up with the card's bottom margin. */
    .hero__cta--below {
      padding: 32px 20px 8px;
      margin: 0;
    }
    /* Primary CTA — button-in-button architecture per skill rules */
    .btn {
      position: relative;
      display: inline-flex; align-items: center; justify-content: space-between; gap: 10px;
      height: 56px;
      padding: 0 8px 0 22px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--hair-3);
      text-decoration: none;
      box-shadow:
        inset 0 1px 0 rgba(222, 192, 122, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.5);
      transition:
        border-color 420ms var(--ease),
        color 420ms var(--ease),
        background 420ms var(--ease),
        transform 220ms var(--ease);
      will-change: transform;
    }
    .btn:hover { border-color: var(--gold); color: var(--gold-bright); }
    .btn:active { transform: scale(0.985); }
    .btn--primary { color: var(--gold-bright); }
    .btn--primary::before {
      content: "";
      position: absolute; inset: 4px;
      border: 1px solid var(--hair);
      pointer-events: none;
      transition: border-color 420ms var(--ease);
    }
    .btn--primary:hover::before { border-color: var(--hair-2); }

    /* Nested arrow bezel — never bare next to text */
    .btn .arr {
      display: inline-grid; place-items: center;
      width: 40px; height: 40px;
      background: rgba(201,169,97,0.06);
      border: 1px solid var(--hair-2);
      color: var(--gold);
      font-size: 13px;
      transition:
        transform 420ms var(--ease),
        background 320ms var(--ease),
        border-color 320ms var(--ease);
    }
    .btn:hover .arr {
      transform: translate(3px, -1px);
      background: rgba(201,169,97,0.14);
      border-color: var(--gold);
    }

    /* Tertiary text link variant — reduces 1-filled+1-ghost monotony */
    .btn--ghost {
      height: 48px;
      padding: 0 22px;
      border: 0;
      box-shadow: none;
      color: var(--ink-2);
      letter-spacing: 0.24em;
      position: relative;
      justify-content: flex-start;
      gap: 12px;
    }
    .btn--ghost::after {
      content: ""; position: absolute; left: 22px; right: 22px; bottom: 8px;
      height: 1px; background: var(--hair-2);
      transition: background 320ms var(--ease), right 420ms var(--ease);
    }
    .btn--ghost:hover { color: var(--gold-bright); }
    .btn--ghost:hover::after { background: var(--gold); right: 16px; }

    /* ── Featured card ─────────────────────────────────────────── */

    .card {
      position: relative;
      background:
        radial-gradient(120% 60% at 50% 0%, rgba(201,169,97,0.06), transparent 55%),
        radial-gradient(120% 100% at 50% 100%, rgba(74,109,148,0.04), transparent 60%),
        linear-gradient(180deg, #14171F 0%, #0C0E14 100%);
      border: 1px solid var(--hair-3);
      box-shadow:
        inset 0 1px 0 rgba(222,192,122,0.14),
        inset 0 -1px 0 rgba(0,0,0,0.5),
        0 18px 40px -22px rgba(0,0,0,0.7),
        0 0 0 1px rgba(0,0,0,0.4);
    }
    .card__inner {
      padding: 18px;
      border: 1px solid var(--hair);
      margin: 8px;
    }
    .card__head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    .card__head--right { justify-content: flex-end; }
    .card__corner {
      position: absolute;
      width: 10px; height: 10px;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.55;
    }
    .card__corner--tl { top: 4px; left: 4px;   border-width: 1px 0 0 1px; }
    .card__corner--tr { top: 4px; right: 4px;  border-width: 1px 1px 0 0; }
    .card__corner--bl { bottom: 4px; left: 4px;  border-width: 0 0 1px 1px; }
    .card__corner--br { bottom: 4px; right: 4px; border-width: 0 1px 1px 0; }

    /* Museum-plinth stage: tall, restrained, no gold "spotlight" glow.
       Figure bottom-aligns to a hairline plinth and casts a soft dark
       contact shadow into the card surface. */
    .glyph-stage {
      position: relative;
      height: 340px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin: 8px 0 14px;
      padding: 12px 0 26px;
      isolation: isolate;
      overflow: hidden;
    }
    /* Soft floor fade — the lower portion of the stage darkens almost
       imperceptibly, anchoring the figure. */
    .glyph-stage::before {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 42%;
      background:
        linear-gradient(180deg,
          transparent 0%,
          rgba(0,0,0,0.10) 60%,
          rgba(0,0,0,0.22) 100%);
      pointer-events: none;
      z-index: 0;
    }
    /* Plinth hairline — single gold thread the figure stands on. */
    .glyph-stage::after {
      content: "";
      position: absolute;
      left: 14%; right: 14%; bottom: 18px;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(201,169,97,0.55) 22%,
        rgba(201,169,97,0.55) 78%,
        transparent 100%);
      pointer-events: none;
      z-index: 0;
    }
    .glyph-stage .nugget {
      position: relative;
      z-index: 1;
      width: auto;
      height: auto;
      max-width: 88%;
      max-height: 100%;
      object-fit: contain;
      /* Bronze-tinted contact shadow reads warmer on dark surface than pure black. */
      filter:
        drop-shadow(0 6px 10px rgba(20, 14, 6, 0.55))
        drop-shadow(0 2px 4px rgba(36, 26, 12, 0.65));
      transition: opacity 320ms var(--ease), transform 320ms var(--ease), filter 320ms var(--ease);
    }
    .glyph--enter { opacity: 0; transform: translateY(6px) scale(0.985); filter: blur(2px); }

    .card__name {
      font-family: var(--serif);
      font-weight: 400;
      font-style: italic;
      font-size: 36px;
      line-height: 1;
      text-align: center;
      color: var(--ink);
      margin: 4px 0 8px;
      text-wrap: balance;
    }
    .card__meta {
      text-align: center;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }
    .card__meta .g { color: var(--gold); }
    .card__archetype {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      margin-top: 12px;
    }
    .card__archetype-text {
      font-family: var(--serif);
      font-style: italic;
      font-size: 15px;
      color: var(--ink-2);
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .card__archetype-rule {
      height: 1px; width: 28px;
      background: linear-gradient(90deg, transparent, rgba(201,169,97,0.45));
    }
    .card__archetype-rule + .card__archetype-text + .card__archetype-rule {
      background: linear-gradient(90deg, rgba(201,169,97,0.45), transparent);
    }

    .card__prev {
      margin-top: 22px;
      border-top: 1px solid var(--hair);
      border-bottom: 1px solid var(--hair);
      padding: 14px 4px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    }
    .card__prev > div { display: flex; flex-direction: column; gap: 6px; }
    .card__prev > div + div { border-left: 1px solid var(--hair); padding-left: 16px; }
    .card__prev .val {
      font-family: var(--mono);
      font-size: 17px;
      color: var(--ink);
      letter-spacing: 0.02em;
    }
    .card__prev .val .ccy { color: var(--ink-dim); margin-right: 6px; font-size: 11px; letter-spacing: 0.2em; }
    .card__prev .val.up   { color: var(--gold-bright); }
    .card__prev .val.down { color: #B07A6E; }

    .card__bio {
      margin-top: 16px;
      font-family: var(--serif);
      font-style: italic;
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--ink-2);
    }

    /* ── Section frames ────────────────────────────────────────── */

    /* Macro-whitespace: 56px → 88px (~py-22 mobile, breathes heavily) */
    .sec { padding: 88px 20px 96px; position: relative; }
    .sec__head {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 28px;
    }
    .sec__head .line { flex: 1; height: 1px; background: var(--hair); }
    .sec__no {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--ink-mute);
      letter-spacing: 0.22em;
    }
    .sec__title {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .sec__lede {
      font-family: var(--serif);
      font-size: 16.5px;
      line-height: 1.55;
      color: var(--ink-2);
      max-width: 38ch;
      margin: 0 0 28px;
      text-wrap: pretty;
    }

    /* ── Copy chip (read-only address) ───────────────────────── */
    .copychip {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 10px;
      border: 1px solid var(--hair-2);
      background: rgba(201,169,97,0.04);
      color: var(--ink-2);
      cursor: pointer;
      font-family: var(--mono);
      font-size: 11.5px;
      letter-spacing: 0.04em;
      transition:
        border-color 280ms var(--ease),
        background 280ms var(--ease),
        color 280ms var(--ease),
        transform 220ms var(--ease);
    }
    .copychip:hover {
      border-color: var(--hair-3);
      color: var(--ink);
      background: rgba(201,169,97,0.08);
    }
    .copychip:active { transform: scale(0.97); }
    .copychip__icon {
      color: var(--gold);
      font-size: 12px;
      line-height: 1;
      transition: color 280ms var(--ease);
    }
    .copychip.is-copied {
      border-color: rgba(111,174,124,0.55);
      color: var(--live);
      background: rgba(111,174,124,0.06);
    }
    .copychip.is-copied .copychip__icon { color: var(--live); }
    .card__addr-pending {
      font-family: var(--serif);
      font-style: italic;
      font-size: 12.5px;
      color: var(--ink-mute);
    }

    /* ── Featured card address rows ─────────────────────────── */
    .card__addr {
      margin-top: 22px;
      padding: 12px 4px 4px;
      border-top: 1px solid var(--hair);
      display: flex; flex-direction: column; gap: 10px;
    }
    .card__addr-row {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px;
    }
    .card__addr-k {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-mute);
    }

    /* ── Registry section ────────────────────────────────────── */
    .reg__facts {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      background: var(--hair);
      border: 1px solid var(--hair);
      margin-bottom: 24px;
    }
    .reg__fact {
      background: var(--bg);
      padding: 18px 16px;
    }
    .reg__fact-k {
      font-family: var(--serif);
      font-size: 28px;
      line-height: 1;
      color: var(--gold-bright);
      letter-spacing: -0.01em;
    }
    .reg__fact-v {
      margin-top: 6px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }
    .reg__meta {
      margin: 0;
      border-top: 1px solid var(--hair);
    }
    .reg__meta .ext {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--gold);
      text-decoration: none;
      border-bottom: 1px solid rgba(201,169,97,0.32);
    }
    .reg__meta .ext:hover {
      color: var(--gold-bright);
      border-bottom-color: var(--gold);
    }

    /* ── Verifier ─────────────────────────────────────────────── */
    .vrf {
      display: flex; gap: 8px;
      margin-bottom: 14px;
    }
    .vrf__input {
      flex: 1;
      height: 48px;
      padding: 0 14px;
      background: var(--surface);
      border: 1px solid var(--hair-2);
      color: var(--ink);
      font-size: 12.5px;
      letter-spacing: 0.04em;
      transition: border-color 220ms var(--ease), background 220ms var(--ease);
    }
    .vrf__input::placeholder { color: var(--ink-mute); }
    .vrf__input:focus {
      outline: none;
      border-color: var(--gold);
      background: var(--surface-2);
    }
    .vrf__submit {
      flex: 0 0 auto;
      height: 48px;
      padding: 0 18px;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold-bright);
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 220ms var(--ease), color 220ms var(--ease), transform 220ms var(--ease);
    }
    .vrf__submit:hover { background: rgba(201,169,97,0.08); color: #fff; }
    .vrf__submit:active { transform: scale(0.985); }
    .vrf__examples {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      margin-bottom: 20px;
    }
    .vrf__example {
      padding: 5px 11px;
      background: transparent;
      border: 1px solid var(--hair);
      color: var(--ink-dim);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 220ms var(--ease), color 220ms var(--ease);
    }
    .vrf__example:hover {
      border-color: var(--hair-3);
      color: var(--ink-2);
    }
    .vrf__example--clear { color: var(--ink-mute); }

    .vrf__result {
      border: 1px solid var(--hair-2);
      padding: 22px 20px;
      background:
        linear-gradient(180deg, rgba(201,169,97,0.04), transparent 70%),
        var(--surface);
    }
    .vrf__result--official-base,
    .vrf__result--official-solana {
      border-color: rgba(201,169,97,0.42);
    }
    .vrf__result--not-found {
      border-color: var(--hair);
      background: var(--surface);
    }
    .vrf__result-head {
      display: flex; align-items: center; gap: 12px;
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1.3;
      color: var(--ink);
      margin-bottom: 14px;
    }
    .vrf__tick {
      flex: 0 0 auto;
      width: 22px; height: 22px;
      border-radius: 50%;
      display: inline-grid; place-items: center;
      background: rgba(201,169,97,0.16);
      color: var(--gold-bright);
      font-size: 12px;
      font-family: var(--mono);
    }
    .vrf__cross {
      flex: 0 0 auto;
      width: 22px; height: 22px;
      border-radius: 50%;
      display: inline-grid; place-items: center;
      background: var(--surface-2);
      color: var(--ink-mute);
      font-size: 14px;
      font-family: var(--mono);
    }
    .vrf__result-body {
      display: flex; flex-direction: column; gap: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--hair);
    }
    .vrf__result-sign {
      display: flex; align-items: center; gap: 14px;
    }
    .vrf__result-icon {
      width: 36px; height: 36px;
      object-fit: contain;
      opacity: 0.95;
    }
    .vrf__result-name {
      font-family: var(--serif);
      font-style: italic;
      font-size: 22px;
      color: var(--ink);
      line-height: 1;
    }
    .vrf__result-meta {
      display: flex; align-items: center; flex-wrap: wrap;
      gap: 0;
      margin-top: 4px;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }
    .vrf__result-meta .dot {
      margin: 0 8px 2px;
    }
    .vrf__result-rows {
      margin: 0;
    }

    /* ── Catalog (Official 12) ───────────────────────────────── */
    .cat__head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px;
    }
    .cat__badge {
      font-size: 8.5px !important;
      letter-spacing: 0.20em;
    }
    .cat__sym--button {
      background: transparent;
      border: 0;
      padding: 0;
      width: 100%;
      cursor: pointer;
    }
    .cat__addr {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px;
      margin-top: 4px;
      padding-top: 10px;
      border-top: 1px solid var(--hair);
    }
    .cat__addr-k {
      font-family: var(--mono);
      font-size: 8.5px;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: var(--ink-mute);
    }
    .cat__addr .copychip {
      padding: 4px 8px;
      font-size: 10.5px;
    }

    /* ── Selector strip — line-art glyphs, halo on active ─────── */

    .strip-wrap {
      padding: 22px 0 22px;
      border-top: 1px solid var(--hair);
      border-bottom: 1px solid var(--hair);
      background:
        linear-gradient(180deg,
          rgba(0,0,0,0.5) 0%,
          rgba(0,0,0,0.7) 50%,
          rgba(0,0,0,0.5) 100%);
      position: relative;
    }
    .strip-wrap::before,
    .strip-wrap::after {
      content: "";
      position: absolute; top: 0; bottom: 0;
      width: 36px;
      pointer-events: none;
      z-index: 2;
    }
    .strip-wrap::before {
      left: 0;
      background: linear-gradient(90deg, var(--bg) 0%, transparent 100%);
    }
    .strip-wrap::after {
      right: 0;
      background: linear-gradient(270deg, var(--bg) 0%, transparent 100%);
    }

    .strip {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 24px 10px;
      overflow-x: auto;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .strip::-webkit-scrollbar { display: none; }

    /* Glyph buttons — small and dim by default; they recede into the
       darkness as if half-remembered. The active one is "lit" by a
       warm amber radial that reads as oil-lamp light, not as UI. */
    .strip__glyph {
      flex: 0 0 auto;
      position: relative;
      width: 38px; height: 38px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: transparent;
      border: 0;
      padding: 0;
      scroll-snap-align: center;
      transition: transform 220ms var(--ease);
    }
    /* Tight warm spotlight on the active glyph — contained halo, no
       breathing scale, no spill onto neighbours. Crossfade is handled
       by the opacity transition: when .is-active migrates elsewhere,
       this fades to 0 over 720ms while the new one fades in. */
    .strip__glyph::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background:
        radial-gradient(50% 50% at 50% 50%,
          rgba(255, 190, 115, 0.32) 0%,
          rgba(232, 158, 78, 0.14) 45%,
          rgba(200, 130, 50, 0.04) 75%,
          transparent 100%);
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      transition: opacity 720ms var(--ease);
    }
    .strip__glyph img {
      position: relative;
      z-index: 1;
      width: 22px; height: 22px;
      object-fit: contain;
      opacity: 0.58;
      filter: saturate(0.75) brightness(0.95);
      transition: opacity 720ms var(--ease), filter 720ms var(--ease);
    }
    .strip__glyph:hover img { opacity: 0.85; filter: saturate(0.9) brightness(1.02); }
    .strip__glyph:active { transform: scale(0.92); }

    .strip__glyph.is-active::before {
      opacity: 1;
    }
    .strip__glyph.is-active img {
      opacity: 1;
      filter:
        saturate(1.2) brightness(1.08)
        drop-shadow(0 0 3px rgba(255, 190, 115, 0.6));
    }

    .strip__sub {
      margin-top: 6px;
      display: flex; align-items: center; justify-content: center;
      gap: 14px;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ink-mute);
      transition: color 420ms var(--ease);
    }
    .strip-wrap.is-autoplay .strip__sub { color: var(--gold-deep); }
    .strip__sub .chev {
      color: var(--ink-dim);
      font-family: var(--serif);
      font-size: 14px;
      opacity: 0.7;
      transition: opacity 320ms var(--ease), transform 420ms var(--ease);
    }
    .strip__sub:hover .chev { opacity: 1; }

    /* ── Museum label / detail panel ───────────────────────────── */

    .detail {
      border: 1px solid var(--hair-2);
      background:
        linear-gradient(180deg, rgba(201,169,97,0.03), transparent 40%),
        var(--surface);
      padding: 22px 20px 24px;
    }
    .detail__name {
      font-family: var(--serif);
      font-size: 30px;
      font-style: italic;
      font-weight: 400;
      color: var(--ink);
      margin: 4px 0 4px;
      line-height: 1;
    }
    .detail__ticker {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.26em;
      color: var(--gold);
    }
    .detail__symbol {
      float: right;
      width: 56px; height: 56px;
      object-fit: contain;
      margin: -4px 0 0 14px;
      filter:
        drop-shadow(0 0 14px rgba(201,169,97,0.32))
        drop-shadow(0 1px 2px rgba(0,0,0,0.5));
    }
    .detail__rows {
      margin-top: 18px;
      border-top: 1px solid var(--hair);
    }
    .detail__row {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 11px 0;
      border-bottom: 1px solid var(--hair);
      gap: 12px;
    }
    .detail__row .k {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }
    .detail__row .v {
      font-family: var(--serif);
      font-size: 16px;
      color: var(--ink);
      text-align: right;
      font-style: italic;
    }
    .detail__row .v.mono {
      font-family: var(--mono);
      font-style: normal;
      font-size: 12.5px;
      color: var(--ink-2);
      letter-spacing: 0.04em;
    }
    .detail__bio {
      margin-top: 18px;
      padding: 16px 18px;
      border: 1px solid var(--hair);
      border-left: 1px solid var(--hair-3);
      font-family: var(--serif);
      font-style: italic;
      font-size: 15.5px;
      line-height: 1.6;
      color: var(--ink-2);
      background: rgba(255,255,255,0.01);
    }

    /* ── Market data strip ─────────────────────────────────────── */

    .mkt {
      border: 1px solid var(--hair-2);
      background: var(--surface);
      padding: 18px 4px 6px;
    }
    .mkt__head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 16px 14px;
      border-bottom: 1px solid var(--hair);
    }
    .mkt__head .pulse {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.22em; color: var(--ink-dim);
      text-transform: uppercase;
    }
    .pulse .dot-live {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--gold-bright);
      box-shadow: 0 0 8px var(--gold);
      animation: pulse 2.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50%      { opacity: 1; }
    }
    .mkt__grid {
      display: grid; grid-template-columns: 1fr 1fr;
    }
    .mkt__cell {
      padding: 14px 16px;
      border-bottom: 1px solid var(--hair);
    }
    .mkt__cell:nth-child(odd)  { border-right: 1px solid var(--hair); }
    .mkt__cell:last-child,
    .mkt__cell:nth-last-child(2):nth-child(odd) { border-bottom: 0; }
    .mkt__k {
      font-family: var(--mono); font-size: 9.5px;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--ink-mute);
      margin-bottom: 6px;
    }
    .mkt__v {
      font-family: var(--mono);
      font-size: 15px;
      color: var(--ink);
      letter-spacing: 0.02em;
    }
    .mkt__v .ccy { color: var(--ink-dim); margin-right: 6px; font-size: 10px; letter-spacing: 0.2em; }
    .mkt__v.up   { color: var(--gold-bright); }
    .mkt__v.down { color: #B07A6E; }
    .mkt__foot {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px 8px;
      font-family: var(--mono); font-size: 9.5px;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--ink-mute);
    }

    /* ── Philosophy — asymmetric pull-quote layout ────────────── */

    .phil {
      padding: 96px 20px 88px;
      background:
        radial-gradient(80% 60% at 30% 0%, rgba(74,109,148,0.07), transparent 60%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      border-top: 1px solid var(--hair);
      border-bottom: 1px solid var(--hair);
      position: relative;
    }
    .phil__sup {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 28px;
      padding-right: 12%;
    }
    .phil__sup .line { flex: 1; height: 1px; background: var(--hair); }
    .phil__body {
      font-family: var(--serif);
      font-size: 22px;
      line-height: 1.45;
      color: var(--ink);
      letter-spacing: -0.005em;
      max-width: 30ch;
      text-wrap: pretty;
    }
    .phil__body .dc {
      font-family: var(--serif);
      float: left;
      font-size: 76px;
      line-height: 0.78;
      color: var(--gold-bright);
      padding: 8px 14px 0 0;
      font-style: italic;
      text-shadow: 0 0 18px rgba(201,169,97,0.25);
    }
    .phil__sig {
      margin-top: 36px;
      margin-left: 28%;
      padding-top: 16px;
      border-top: 1px solid var(--hair);
      display: flex; justify-content: space-between; align-items: baseline;
      font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.22em; color: var(--ink-mute);
      text-transform: uppercase;
    }

    /* ── Twelve signs catalog ──────────────────────────────────── */

    .cat {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .cat__item {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--hair);
      padding: 14px 12px 12px;
      text-align: left;
      transition:
        border-color 420ms var(--ease),
        background 420ms var(--ease),
        box-shadow 420ms var(--ease),
        transform 220ms var(--ease);
      display: flex; flex-direction: column; gap: 8px;
    }
    .cat__item:hover { border-color: var(--hair-2); }
    .cat__item:active { transform: scale(0.98); }
    .cat__item:first-child { margin-top: 0; }
    .cat__item:nth-child(2) { margin-top: 0; }
    .cat__item.is-active {
      border-color: var(--gold);
      background: linear-gradient(180deg, rgba(201,169,97,0.05), transparent 60%), var(--surface-2);
      box-shadow: 0 0 0 1px rgba(201,169,97,0.2), 0 0 24px -8px rgba(201,169,97,0.35);
    }
    .cat__no {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.22em;
      color: var(--ink-mute);
    }
    .cat__sym {
      position: relative;
      height: 130px;
      display: flex; align-items: flex-end; justify-content: center;
      margin: 4px 0 10px;
      padding: 6px 0 16px;
      overflow: hidden;
      isolation: isolate;
    }
    .cat__sym::before {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 38%;
      background: linear-gradient(180deg,
        transparent 0%,
        rgba(0,0,0,0.10) 60%,
        rgba(0,0,0,0.22) 100%);
      z-index: 0;
      pointer-events: none;
    }
    .cat__sym::after {
      content: "";
      position: absolute;
      left: 16%; right: 16%; bottom: 10px;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(201,169,97,0.42) 22%,
        rgba(201,169,97,0.42) 78%,
        transparent 100%);
      z-index: 0;
      pointer-events: none;
    }
    .cat__sym img {
      position: relative; z-index: 1;
      width: auto;
      height: 100%;
      max-width: 92%;
      object-fit: contain;
      filter:
        drop-shadow(0 4px 6px rgba(20, 14, 6, 0.5))
        drop-shadow(0 1px 2px rgba(36, 26, 12, 0.6));

       Address row is now rendered by .cat__addr — see new-section CSS.) */

    /* ── Closing ───────────────────────────────────────────────── */

    .close {
      padding: 112px 20px 96px;

    /* ── Footer ────────────────────────────────────────────────── */

    .ftr .mark { color: var(--ink-2); letter-spacing: 0.18em; font-family: var(--serif); text-transform: none; font-size: 13px; }
    .ftr .mark .g { color: var(--gold); }
    .ftr__legal {
      display: inline-flex; flex-wrap: wrap; gap: 12px 14px;

    /* Origin credit — quietest possible footer line. Not a brand
       statement; just acknowledges where this work began. No link, no
       gold accent, no italic. */
    .ftr__row--origin {
      justify-content: center;
      text-align: center;
      font-family: var(--mono);
      font-size: 8.5px;

    .ftr__legal a:hover { color: var(--gold); }

    /* ── Transitions on active content ─────────────────────────── */

    .fade-key { animation: fadeInUp 520ms var(--ease) both; }
    @keyframes fadeInUp {
      0%   { opacity: 0; transform: translateY(6px); filter: blur(3px); }
      100% { opacity: 1; transform: translateY(0);   filter: blur(0);   }
    }

    /* Scroll-driven entry — IntersectionObserver-controlled */
    .reveal {
      opacity: 0;
      transform: translateY(18px);
      filter: blur(6px);
      transition:
        opacity 900ms var(--ease),
        transform 900ms var(--ease),
        filter 900ms var(--ease);
      will-change: opacity, transform, filter;
    }
    .reveal.is-in {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal, .fade-key {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }
    }

    /* ── Compact width tweaks (≤ 380px / iPhone SE-ish) ────────── */
    @media (max-width: 380px) {
      .hero__headline { font-size: 38px; }
      .glyph-stage { height: 300px; padding: 8px 0 22px; }
      .card__name { font-size: 32px; }

  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;

    // IntersectionObserver-driven scroll reveal — no static mount.
    // Returns a ref-callback that adds `is-in` once the element enters.
    function useReveal(threshold = 0.15) {
      return useCallback((el) => {
        if (!el) return;
        const io = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) {
            el.classList.add('is-in');
            io.disconnect();
          }
        }, { threshold, rootMargin: '0px 0px -10% 0px' });
        io.observe(el);
      }, [threshold]);
    }

    // ──────────────────────────────────────────────────────────────
    // Local metadata for all twelve signs.
    // Market values are placeholder fixtures — never live data.
    // ──────────────────────────────────────────────────────────────
    // Asset identity = the sign. Chain-specific addresses are
    // *representations* of that identity. This shape mirrors
    // registry/zodiacs.registry.json which is the public source of truth.
    // Solana mints are intentionally null until the native registry
    // entries are supplied — the UI renders a "from official registry"
    // placeholder for those.
    const SIGNS = [
      { name: 'Aries',       ticker: 'ARIES',       order: 1,  element: 'Fire',  modality: 'Cardinal', rulingPlanet: 'Mars',
        symbol: '♈︎', archetype: 'The Initiator',
        shortBio: 'The first spark. Aries marks the vernal equinox, long honored across civilizations as the renewal of time and the opening of the symbolic year.',
        representations: { solana: { mint: null, status: 'pending' }, base: { address: '0x3ffB5282F5891Dd8c813E64059EdB0607537eC91', status: 'official' } } },
      { name: 'Taurus',      ticker: 'TAURUS',      order: 2,  element: 'Earth', modality: 'Fixed',    rulingPlanet: 'Venus',
        symbol: '♉︎', archetype: 'The Keeper',
        shortBio: 'The bull held sacred from Çatalhöyük to Knossos. Taurus carries a long memory of fertility, endurance, and material stewardship.',
        representations: { solana: { mint: null, status: 'pending' }, base: { address: '0xd5356c6E529569c6912978433DAfb7ca72B5f09C', status: 'official' } } },
      { name: 'Gemini',      ticker: 'GEMINI',      order: 3,  element: 'Air',   modality: 'Mutable',  rulingPlanet: 'Mercury',
        symbol: '♊︎', archetype: 'The Messenger',
        shortBio: 'The twins. From Castor and Pollux to the dual nature of language itself, Gemini holds the symbol of human exchange and discourse.',
        representations: { solana: { mint: null, status: 'pending' }, base: { address: '0x8F6eb25aB4CD2F8f064f7da5E35136D4EC600b4f', status: 'official' } } },
      { name: 'Cancer',      ticker: 'CANCER',      order: 4,  element: 'Water', modality: 'Cardinal', rulingPlanet: 'Moon',
        symbol: '♋︎', archetype: 'The Vessel',
        shortBio: 'The crab and the moon. The summer solstice. Cancer preserves the ancient image of home, memory, and the inner tide.',
        representations: { solana: { mint: null, status: 'pending' }, base: { address: '0xb9Fd3c3157C7b69260Ca285FbbC74F6309226378', status: 'official' } } },
      { name: 'Leo',         ticker: 'LEO',         order: 5,  element: 'Fire',  modality: 'Fixed',    rulingPlanet: 'Sun',
        symbol: '♌︎', archetype: 'The Sovereign',
        shortBio: 'The lion. Older than empires. Leo carries the sun at the height of summer. The symbol of radiant authority and visible self.',
        representations: { solana: { mint: null, status: 'pending' }, base: { address: '0x4f7B4c12DE5d47314C86Ed3BA25E289aA139CF75', status: 'official' } } },
      { name: 'Virgo',       ticker: 'VIRGO',       order: 6,  element: 'Earth', modality: 'Mutable',  rulingPlanet: 'Mercury',
        symbol: '♍︎', archetype: 'The Scribe',
        shortBio: 'The maiden of the harvest. Virgo preserves the long lineage of craft, discernment, and the discipline of measure.',
        representations: { solana: { mint: null, status: 'pending' }, base: { address: '0xAcFd97106bbE5D931aC430Be76A8E362832D48f4', status: 'official' } } },
      { name: 'Libra',       ticker: 'LIBRA',       order: 7,  element: 'Air',   modality: 'Cardinal', rulingPlanet: 'Venus',
        symbol: '♎︎', archetype: 'The Arbiter',
        shortBio: 'The scales. The autumn equinox. Libra holds the symbol of balance, civic measure, and the law as a cultural form.',
        representations: { solana: { mint: null, status: 'pending' }, base: { address: '0x4201eff5F419CD6EEDFb28fa240edeaFc9002204', status: 'official' } } },
      { name: 'Scorpio',     ticker: 'SCORPIO',     order: 8,  element: 'Water', modality: 'Fixed',    rulingPlanet: 'Pluto',
        symbol: '♏︎', archetype: 'The Initiate',
        shortBio: 'The scorpion of the deep year. Scorpio carries the rites of transformation. The threshold between what passes and what endures.',
        representations: { solana: { mint: null, status: 'pending' }, base: { address: '0x0057C9cB6D16C2ecA808788f14d0d0c367b26676', status: 'official' } } },
      { name: 'Sagittarius', ticker: 'SAGITTARIUS', order: 9,  element: 'Fire',  modality: 'Mutable',  rulingPlanet: 'Jupiter',
        symbol: '♐︎', archetype: 'The Seeker',
        shortBio: 'The archer at the galactic center. Sagittarius preserves the impulse to travel, to inquire, to chart what lies beyond the known.',
        representations: { solana: { mint: null, status: 'pending' }, base: { address: '0xD21fAb1EB5E11AC3C281F7cF8096eCC4683eEa9c', status: 'official' } } },
      { name: 'Capricorn',   ticker: 'CAPRICORN',   order: 10, element: 'Earth', modality: 'Cardinal', rulingPlanet: 'Saturn',
        symbol: '♑︎', archetype: 'The Architect',
        shortBio: 'The sea-goat. The winter solstice. Capricorn carries the long pattern of structure, lineage, and the building of enduring forms.',
        representations: { solana: { mint: null, status: 'pending' }, base: { address: '0xbFB102C18FDf49f2ffCB9B3aF4522f7DC9f51018', status: 'official' } } },
      { name: 'Aquarius',    ticker: 'AQUARIUS',    order: 11, element: 'Air',   modality: 'Fixed',    rulingPlanet: 'Uranus',
        symbol: '♒︎', archetype: 'The Heretic',
        shortBio: 'The water-bearer. Aquarius holds the symbol of the unbound mind: invention, dissent, the long arc of cultural shift.',
        representations: { solana: { mint: null, status: 'pending' }, base: { address: '0xccA7CD4F96336Fd26eF6c5F579eaC651bAC5535F', status: 'official' } } },
      { name: 'Pisces',      ticker: 'PISCES',      order: 12, element: 'Water', modality: 'Mutable',  rulingPlanet: 'Neptune',
        symbol: '♓︎', archetype: 'The Mystic',
        shortBio: 'Two fishes bound by a silver cord. Pisces closes the wheel. The symbol of dissolution, depth, and the world before the next renewal.',
        representations: { solana: { mint: null, status: 'pending' }, base: { address: '0x43fA1855a89b7A3e07426Fa7a1B44b4187d29Daf', status: 'official' } } },
    ];

    // Verifier lookup helpers — also the read-only shape the future
    // @zodiacs/sdk will expose as isOfficialZodiacAddress() etc.
    const norm = (s) => (s || '').trim();
    const eq = (a, b) => norm(a).toLowerCase() === norm(b).toLowerCase();
    function lookupAddress(input) {
      const q = norm(input);
      if (!q) return null;
      for (const sign of SIGNS) {
        if (sign.representations.base.address && eq(sign.representations.base.address, q)) {
          return { sign, network: 'base', representation: sign.representations.base };
        }
        if (sign.representations.solana.mint && eq(sign.representations.solana.mint, q)) {
          return { sign, network: 'solana', representation: sign.representations.solana };
        }
      }
      return null;
    }
    function truncateAddress(a, lead = 6, tail = 4) {
      if (!a || a.length <= lead + tail + 2) return a || '';
      return `${a.slice(0, lead)}…${a.slice(-tail)}`;
    }

    const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];

    // ──────────────────────────────────────────────────────────────
    // Sub-components
    // ──────────────────────────────────────────────────────────────

    function Header() {
      return (
        <div className="hdr-wrap">
          <header className="hdr" role="banner">
            <div className="hdr__mark">
              <span>Zodiacs</span><span className="sep">·</span><span className="dim">org</span>
            </div>
            <a className="hdr__nav" href="#registry">
              <span>Registry</span>
              <span className="chip">↗</span>
            </a>
          </header>
        </div>
      );
    }

    function Hero({ sign, animKey, active, setActive }) {
      return (
        <section className="hero" id="main">
          <div className="hero__eyebrow">
            <span className="pulse-dot" aria-hidden="true" />
            <span className="label label--gold" style={{ fontSize: 9.5 }}>
              <span className="sr-only">Live. </span>
              The Registry
            </span>
          </div>

          <h1 className="hero__headline">
            Twelve signs.<br/>
            <span className="it">One register.</span>
          </h1>

          <p className="hero__sub">
            Native to Solana, bridged to Base.
            Verify any address against the Twelve.
          </p>

          <Selector active={active} setActive={setActive} />

          <FeaturedCard sign={sign} animKey={animKey} />
        </section>
      );
    }

    function HeroActions() {
      return (
        <div className="hero__cta hero__cta--below">
          <a className="btn btn--primary" href="#official-twelve">
            <span>Browse the Twelve</span>
            <span className="arr">→</span>
          </a>
          <a className="btn btn--ghost" href="#verify">
            <span>Verify an address</span>
            <span className="arr" style={{ width: 28, height: 28, background: 'transparent', border: 0, color: 'var(--ink-dim)' }}>↗</span>
          </a>
        </div>
      );
    }

    function FeaturedCard({ sign, animKey }) {
      const reveal = useReveal();
      const baseAddr = sign.representations.base.address;
      const solanaMint = sign.representations.solana.mint;

      return (
        <article ref={reveal} className="card reveal" aria-label={`Featured sign · ${sign.name}`}>
          <span className="card__corner card__corner--tl" />
          <span className="card__corner card__corner--tr" />
          <span className="card__corner card__corner--bl" />
          <span className="card__corner card__corner--br" />

          <div className="card__inner">
            <div className="card__head card__head--right">
              <span className="label label--mute">
                {ROMAN[sign.order - 1]}<span className="sep">/</span>XII
              </span>
            </div>

            <div className="glyph-stage">
              <img
                className="nugget fade-key"
                key={animKey + '-glyph'}
                src={`assets/nuggets/${sign.name.toLowerCase()}.png`}
                alt={`${sign.name} sculptural figure`}
                fetchpriority="high"
                decoding="async"
              />
            </div>

            <div className="fade-key" key={animKey + '-meta'}>
              <h2 className="card__name">{sign.name}</h2>
              <div className="card__meta">
                <span className="g">{sign.ticker}</span>
                <span className="dot" />
                <span>{sign.element}</span>
                <span className="dot" />
                <span>{sign.modality}</span>
                <span className="dot" />
                <span>{sign.rulingPlanet}</span>
              </div>
              <div className="card__archetype">
                <span className="card__archetype-rule" aria-hidden="true" />
                <span className="card__archetype-text">{sign.archetype}</span>
                <span className="card__archetype-rule" aria-hidden="true" />
              </div>
            </div>

            <div className="card__addr fade-key" key={animKey + '-addr'}>
              <div className="card__addr-row">
                <span className="card__addr-k">Native · Solana</span>
                {solanaMint
                  ? <CopyChip text={solanaMint} display={truncateAddress(solanaMint, 4, 4)} />
                  : <span className="card__addr-pending">Forthcoming</span>}
              </div>
              <div className="card__addr-row">
                <span className="card__addr-k">Bridged · Base</span>
                <CopyChip text={baseAddr} display={truncateAddress(baseAddr, 6, 4)} />
              </div>

            <p className="card__bio fade-key" key={animKey + '-bio'}>

            </p>
          </div>
        </article>
      );
    }

    /* Read-only copy chip — visible as a monospace truncated address;
       click copies the full address to clipboard and flashes "Copied". */
    function CopyChip({ text, display }) {
      const [copied, setCopied] = useState(false);
      const onCopy = useCallback(() => {
        if (!text) return;
        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            setCopied(true);
            setTimeout(() => setCopied(false), 1400);
          });
        }
      }, [text]);
      return (
        <button
          type="button"
          className={'copychip' + (copied ? ' is-copied' : '')}
          onClick={onCopy}
          aria-label={`Copy address ${text}`}
          title={text}
        >
          <span className="copychip__text mono">{display || text}</span>
          <span className="copychip__icon" aria-hidden="true">
            {copied ? '✓' : '⧉'}
          </span>
        </button>
      );
    }

    // Auto-advance cadence (ms) — must match the CSS @keyframes
    // `strip-countdown` duration. Keep them in lockstep or the visual
    // ring desyncs from the actual hand-off.
    const SELECTOR_CYCLE_MS = 4000;

    function Selector({ active, setActive }) {
      const ref = useRef(null);
      const mounted = useRef(false);
      const [autoplay, setAutoplay] = useState(true);

      // Honour OS-level reduced-motion: disable autoplay outright.
      useEffect(() => {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (mq.matches) setAutoplay(false);
        const onChange = () => mq.matches && setAutoplay(false);
        mq.addEventListener?.('change', onChange);
        return () => mq.removeEventListener?.('change', onChange);
      }, []);

      // Pause autoplay while the tab is backgrounded.
      const [tabVisible, setTabVisible] = useState(
        typeof document !== 'undefined' ? document.visibilityState === 'visible' : true
      );
      useEffect(() => {
        const onVis = () => setTabVisible(document.visibilityState === 'visible');
        document.addEventListener('visibilitychange', onVis);
        return () => document.removeEventListener('visibilitychange', onVis);
      }, []);

      // Pause autoplay when the strip scrolls off-screen, so the
      // featured card doesn't quietly change underneath a user who
      // has scrolled down to read the museum label or catalog.
      const [stripVisible, setStripVisible] = useState(true);
      useEffect(() => {
        const node = ref.current?.parentElement; // .strip-wrap
        if (!node || typeof IntersectionObserver === 'undefined') return;
        const io = new IntersectionObserver(
          ([entry]) => setStripVisible(entry.isIntersecting),
          { threshold: 0.4 }
        );
        io.observe(node);
        return () => io.disconnect();
      }, []);

      // Drive the rotation. Each active ticker change resets the timer,
      // so the countdown ring always starts fresh on the new sign.
      const running = autoplay && tabVisible && stripVisible;
      useEffect(() => {
        if (!running) return;
        const id = setTimeout(() => {
          const idx = SIGNS.findIndex(s => s.ticker === active);
          const next = SIGNS[(idx + 1) % SIGNS.length].ticker;
          setActive(next);
        }, SELECTOR_CYCLE_MS);
        return () => clearTimeout(id);
      }, [active, running, setActive]);

      // First manual interaction stops autoplay for the session. Both
      // direct taps and drag/scroll of the strip count as "user took
      // control", and from then on the page respects the user's pick.
      const stopAutoplay = () => setAutoplay(false);

      useEffect(() => {
        const strip = ref.current;
        if (!strip) return;
        const handler = () => stopAutoplay();
        strip.addEventListener('pointerdown', handler, { once: true, passive: true });
        strip.addEventListener('wheel',       handler, { once: true, passive: true });
        return () => {
          strip.removeEventListener('pointerdown', handler);
          strip.removeEventListener('wheel',       handler);
        };
      }, []);

      // Horizontal-only centering — never touch page vertical scroll.
      useEffect(() => {
        const strip = ref.current;
        const el = strip?.querySelector('.is-active');
        if (!strip || !el) return;
        const target =
          el.offsetLeft - strip.clientWidth / 2 + el.clientWidth / 2;
        strip.scrollTo({
          left: Math.max(0, target),
          behavior: mounted.current ? 'smooth' : 'auto',
        });
        mounted.current = true;
      }, [active]);

      const handlePick = (ticker) => {
        stopAutoplay();
        setActive(ticker);
      };

      return (
        <section
          className={'strip-wrap' + (running ? ' is-autoplay' : '')}
          aria-label="Zodiac selector"
        >
          <div className="strip" ref={ref} role="tablist">
            {SIGNS.map(s => {
              const isActive = active === s.ticker;
              return (
                <button
                  key={s.ticker}
                  className={'strip__glyph' + (isActive ? ' is-active' : '')}
                  onClick={() => handlePick(s.ticker)}
                  role="tab"
                  aria-pressed={isActive}
                  aria-label={s.name}
                  title={s.name}
                >
                  <img
                    src={`assets/icons/${s.name.toLowerCase()}.png`}
                    alt=""
                    loading="lazy"
                    decoding="async"
                  />
                </button>
              );
            })}
          </div>
          <div className="strip__sub">
            <span className="chev" aria-hidden="true">‹</span>
            <span>
              {running ? 'Auto-rotating · tap to pin' : 'Scroll or drag to explore'}
            </span>
            <span className="chev" aria-hidden="true">›</span>
          </div>
        </section>
      );
    }

    /* The 'Registry' section — institutional identity card. Same
       museum-vitrine aesthetic as the Detail Panel; restated as facts
       about the registry itself, not about a single sign. */
    function RegistrySection() {
      const reveal = useReveal();
      const facts = [
        { k: '12',         v: 'Signs' },
        { k: '1',          v: 'Native chain' },
        { k: '2',          v: 'Networks' },
        { k: 'Read-only',  v: 'SDK' },
      ];
      const meta = [
        { k: 'Native chain',   v: 'Solana · SPL' },
        { k: 'Bridged chain',  v: 'Base · ERC-20' },
        { k: 'Bridges',        v: 'Wormhole · Symbiosis' },
        { k: 'SDK',            v: '@zodiacs/sdk · read-only' },
        { k: 'Registry',       v: <a className="ext" href="/registry/zodiacs.registry.json">zodiacs.registry.json</a> },
      ];

      return (
        <section ref={reveal} id="registry" className="sec reveal" aria-label="Registry">
          <div className="sec__head">
            <span className="sec__no">№ 01</span>
            <span className="line" />
            <span className="sec__title">Registry</span>
          </div>
          <p className="sec__lede">
            Each sign exists once. Native on Solana,
            with a bridged representation on Base.
          </p>

          <div className="reg__facts">
            {facts.map((f, i) => (
              <div className="reg__fact" key={i}>
                <div className="reg__fact-k">{f.k}</div>
                <div className="reg__fact-v">{f.v}</div>
              </div>
            ))}
          </div>

          <dl className="reg__meta">
            {meta.map((m, i) => (
              <div className="detail__row" key={i}>
                <dt className="k">{m.k}</dt>
                <dd className="v">{m.v}</dd>
              </div>
            ))}
          </dl>
        </section>
      );
    }

    /* Verifier — the most strategically important section on the page.
       Real working JS against the embedded SIGNS array. Three states:
       found-base, found-solana, not-found. Neutral copy for unknowns. */
    function VerifierSection() {
      const reveal = useReveal();
      const [input, setInput] = useState('');
      const [result, setResult] = useState(null); // null | {state, sign?, network?}
      const onSubmit = (e) => {
        e.preventDefault();
        const hit = lookupAddress(input);
        if (!hit) { setResult({ state: 'not-found', queried: norm(input) }); return; }
        setResult({ state: 'official-' + hit.network, sign: hit.sign, network: hit.network, queried: norm(input) });
      };
      const onClear = () => { setInput(''); setResult(null); };
      // Pick three "try-one" examples so the section demonstrates itself.
      const examples = ['LEO', 'CANCER', 'PISCES'].map(t => SIGNS.find(s => s.ticker === t));

      return (
        <section ref={reveal} id="verify" className="sec reveal" aria-label="Verify">
          <div className="sec__head">
            <span className="sec__no">№ 02</span>
            <span className="line" />
            <span className="sec__title">Verify</span>
          </div>
          <p className="sec__lede">
            Paste an address. We'll tell you which sign.
          </p>

          <form className="vrf" onSubmit={onSubmit}>
            <label className="sr-only" htmlFor="vrf-input">Address</label>
            <input
              id="vrf-input"
              className="vrf__input mono"
              type="text"
              autoComplete="off"
              spellCheck={false}
              placeholder="Paste an address"
              value={input}
              onChange={e => setInput(e.target.value)}
            />
            <button type="submit" className="vrf__submit">Verify</button>
          </form>

          <div className="vrf__examples">
            <span className="label label--mute">Try one</span>
            {examples.map(s => (
              <button
                key={s.ticker}
                type="button"
                className="vrf__example"
                onClick={() => setInput(s.representations.base.address)}
              >
                {s.name}
              </button>
            ))}
            {input && (
              <button type="button" className="vrf__example vrf__example--clear" onClick={onClear}>
                Clear
              </button>
            )}
          </div>

          {result && (
            <div className={'vrf__result vrf__result--' + result.state} role="status" aria-live="polite">
              {result.state === 'official-base' && (
                <>
                  <div className="vrf__result-head">
                    <span className="vrf__tick">✓</span>
                    <span>Bridged Zodiac · Base</span>
                  </div>
                  <VrfResultBody sign={result.sign} network="base" queried={result.queried} />
                </>
              )}
              {result.state === 'official-solana' && (
                <>
                  <div className="vrf__result-head">
                    <span className="vrf__tick">✓</span>
                    <span>Native Zodiac · Solana</span>
                  </div>
                  <VrfResultBody sign={result.sign} network="solana" queried={result.queried} />
                </>
              )}
              {result.state === 'not-found' && (
                <>
                  <div className="vrf__result-head">
                    <span className="vrf__cross">—</span>
                    <span>Not among the Twelve.</span>
                  </div>
                  <div className="vrf__result-meta mono">{truncateAddress(result.queried, 10, 8) || '—'}</div>
                </>
              )}
            </div>
          )}
        </section>
      );
    }

    function VrfResultBody({ sign, network, queried }) {
      return (
        <div className="vrf__result-body">
          <div className="vrf__result-sign">
            <img
              className="vrf__result-icon"
              src={`assets/icons/${sign.name.toLowerCase()}.png`}
              alt=""
              decoding="async"
            />
            <div>
              <div className="vrf__result-name">{sign.name}</div>
              <div className="vrf__result-meta">
                <span className="mono">{sign.ticker}</span>
                <span className="dot" />
                <span>{sign.element}</span>
                <span className="dot" />
                <span>{sign.modality}</span>
                <span className="dot" />
                <span>{sign.rulingPlanet}</span>
              </div>
            </div>
          </div>
          <dl className="vrf__result-rows">
            <div className="detail__row">
              <dt className="k">Network</dt>
              <dd className="v">{network === 'base' ? 'Base · ERC-20' : 'Solana · SPL'}</dd>
            </div>
            <div className="detail__row">
              <dt className="k">Address</dt>
              <dd className="v"><CopyChip text={queried} display={truncateAddress(queried, 8, 6)} /></dd>
            </div>
            <div className="detail__row">
              <dt className="k">{network === 'base' ? 'Native counterpart' : 'Bridged counterpart'}</dt>
              <dd className="v">
                {network === 'base'
                  ? (sign.representations.solana.mint
                      ? <CopyChip text={sign.representations.solana.mint} display={truncateAddress(sign.representations.solana.mint, 4, 4)} />
                      : <span className="card__addr-pending">Forthcoming</span>)
                  : <CopyChip text={sign.representations.base.address} display={truncateAddress(sign.representations.base.address, 6, 4)} />}
              </dd>
            </div>
          </dl>
        </div>
      );
    }

    function DetailPanel({ sign, animKey }) {
      const reveal = useReveal();
      return (
        <section ref={reveal} className="sec reveal" aria-label="Detail panel">
          <div className="sec__head">
            <span className="sec__no">№ 03</span>
            <span className="line" />
            <span className="sec__title">Museum label</span>
          </div>

          <article className="detail fade-key" key={animKey + '-detail'}>
            <img
              className="detail__symbol"
              src={`assets/icons/${sign.name.toLowerCase()}.png`}
              alt=""
              decoding="async"
            />
            <span className="detail__ticker">{sign.ticker}</span>
            <h3 className="detail__name">{sign.name}</h3>

            <div className="detail__rows">
              <div className="detail__row">
                <span className="k">Order</span>
                <span className="v mono">{String(sign.order).padStart(2, '0')} / 12</span>
              </div>
              <div className="detail__row">
                <span className="k">Element</span>
                <span className="v">{sign.element}</span>
              </div>
              <div className="detail__row">
                <span className="k">Modality</span>
                <span className="v">{sign.modality}</span>
              </div>
              <div className="detail__row">
                <span className="k">Ruling planet</span>
                <span className="v">{sign.rulingPlanet}</span>
              </div>
              <div className="detail__row">
                <span className="k">Archetype</span>
                <span className="v">{sign.archetype}</span>
              </div>
              <div className="detail__row">
                <span className="k">Native · Solana</span>
                <span className="v">
                  {sign.representations.solana.mint
                    ? <CopyChip text={sign.representations.solana.mint} display={truncateAddress(sign.representations.solana.mint, 4, 4)} />
                    : <span className="card__addr-pending">Forthcoming</span>}
                </span>
              </div>
              <div className="detail__row">
                <span className="k">Bridged · Base</span>
                <span className="v">
                  <CopyChip text={sign.representations.base.address} display={truncateAddress(sign.representations.base.address, 6, 4)} />
                </span>
              </div>
            </div>

            <blockquote className="detail__bio">
              {sign.shortBio}
            </blockquote>
          </article>
        </section>
      );
    }

    /* Reference data — repurposed from the trading-terminal MarketStrip
       so the eight-cell vitrine layout is preserved but the contents are
       registry/provenance facts, not financial. No prices, no FDV, no
       24h change. Brief explicitly forbids financial-promotion language. */
    function ReferenceStrip({ sign, animKey }) {
      const baseAddr = sign.representations.base.address;
      const solanaMint = sign.representations.solana.mint;
      const cells = [
        { k: 'Native chain',    v: 'Solana' },
        { k: 'Native mint',     v: <span className="mono">{solanaMint ? truncateAddress(solanaMint, 4, 4) : '—'}</span> },
        { k: 'Bridged chain',   v: 'Base' },
        { k: 'Bridged address', v: <span className="mono">{truncateAddress(baseAddr, 6, 4)}</span> },
        { k: 'Bridges',         v: 'Wormhole · Symbiosis' },
        { k: 'Standard',        v: 'SPL · ERC-20' },
        { k: 'Series',          v: <span className="mono">№ {String(sign.order).padStart(2, '0')} / 12</span> },
        { k: 'Element',         v: sign.element },
      ];

      const reveal = useReveal();
      return (
        <section ref={reveal} className="sec reveal" aria-label="Reference data">
          <div className="sec__head">
            <span className="sec__no">№ 04</span>
            <span className="line" />
            <span className="sec__title">Reference data</span>
          </div>

          <div className="mkt fade-key" key={animKey + '-mkt'}>
            <div className="mkt__head">
              <span className="pulse">
                <span className="dot-live" />
                <span>{sign.ticker}</span>
              </span>
              <span className="label label--mute">Read-only</span>
            </div>

            <div className="mkt__grid">
              {cells.map((c, i) => (
                <div className="mkt__cell" key={i}>
                  <div className="mkt__k">{c.k}</div>
                  <div className="mkt__v">{c.v}</div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    function Philosophy() {
      const reveal = useReveal();
      return (
        <section ref={reveal} id="thesis" className="phil reveal" aria-label="Philosophy">
          <div className="phil__sup">
            <span className="label label--gold">№ 05 · Thesis</span>
            <span className="line" />
          </div>
          <p className="phil__body">
            <span className="dc">B</span>efore modern markets, nations, and digital
            identities, the zodiac gave civilization a symbolic language for
            time, character, and destiny. Zodiacs.org preserves that memory
            in a digital form built around identity, scarcity, and cultural
            endurance.
          </p>
          <div className="phil__sig">
            <span>Composed in twelve parts</span>
            <span>·</span>
            <span>MMXXVI</span>
          </div>
        </section>
      );
    }

    function CatalogGrid({ active, setActive }) {
      const reveal = useReveal();
      return (
        <section ref={reveal} className="sec reveal" id="official-twelve" aria-label="The official twelve">
          <div className="sec__head">
            <span className="sec__no">№ 06</span>
            <span className="line" />
            <span className="sec__title">The Twelve</span>
          </div>

          <div className="cat">
            {SIGNS.map(s => (
              <div
                key={s.ticker}
                className={'cat__item' + (active === s.ticker ? ' is-active' : '')}
              >
                <div className="cat__head">
                  <span className="cat__no">№ {String(s.order).padStart(2, '0')} / 12</span>
                </div>
                <button
                  type="button"
                  className="cat__sym cat__sym--button"
                  onClick={() => {
                    setActive(s.ticker);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                  }}
                  aria-label={`Feature ${s.name}`}
                >
                  <img
                    src={`assets/nuggets/thumb/${s.name.toLowerCase()}.png`}
                    alt={`${s.name} figure`}
                    loading="lazy"
                    decoding="async"
                  />
                </button>
                <div className="cat__name">{s.name}</div>
                <div className="cat__tk">{s.ticker}</div>
                <div className="cat__meta">{s.element} · {s.archetype}</div>
                <div className="cat__addr">
                  <span className="cat__addr-k">Base</span>
                  <CopyChip
                    text={s.representations.base.address}
                    display={truncateAddress(s.representations.base.address, 5, 4)}
                  />
                </div>
              </div>
            ))}
          </div>
        </section>
      );
    }

    function Closing() {
      const reveal = useReveal();
      return (
        <section ref={reveal} className="close reveal" aria-label="Closing">
          <div className="close__sigil">
            ♈︎ ♉︎ ♊︎ ♋︎ ♌︎ ♍︎ ♎︎ ♏︎ ♐︎ ♑︎ ♒︎ ♓︎
          </div>
          <h2 className="close__head">
            Twelve signs.<br/>
            <span className="it">One enduring language.</span>
          </h2>
          <p className="close__sub">
            A symbolic collection for a digital era.
          </p>
          <a className="btn btn--primary" href="#official-twelve" style={{ width: '100%', justifyContent: 'space-between' }}>
            <span>View the Twelve</span>
            <span className="arr">→</span>
          </a>
        </section>
      );
    }

    function Footer() {
      return (
        <footer className="ftr">
          <div className="ftr__row">
            <div className="mark">Zodiacs<span className="g">·</span>org</div>
            <div>© MMXXVI</div>
          </div>
          <div className="ftr__row">
            <div className="ftr__legal">
              <a href="#registry">Registry</a>
              <a href="#verify">Verify</a>
              <a href="/registry/zodiacs.registry.json">JSON</a>
              <a href="#thesis">Thesis</a>
            </div>
            <div>Read-only</div>
          </div>
          <div className="ftr__row ftr__row--origin">
            <span>Origin · Astrofolio · MMXXVI</span>
          </div>
        </footer>
      );
    }

    // ──────────────────────────────────────────────────────────────
    // Root
    // ──────────────────────────────────────────────────────────────
    function Zodiacs() {
      const [activeTicker, setActiveTicker] = useState('LEO');
      const sign = useMemo(
        () => SIGNS.find(s => s.ticker === activeTicker) ?? SIGNS[0],
        [activeTicker]
      );

      return (
        <>
          <a href="#main" className="skip">Skip to content</a>
          <div className="stars" aria-hidden="true" />
          <div className="grain" aria-hidden="true" />
          <div className="zd">
            <Header />
            <Hero
              sign={sign}
              animKey={activeTicker}
              active={activeTicker}
              setActive={setActiveTicker}
            />
            <HeroActions />
            <RegistrySection />
            <VerifierSection />
            <DetailPanel sign={sign} animKey={activeTicker} />
            <ReferenceStrip sign={sign} animKey={activeTicker} />
            <Philosophy />
            <CatalogGrid active={activeTicker} setActive={setActiveTicker} />
            <Closing />
            <Footer />
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Zodiacs />);
  </script>
</body>
</html>
