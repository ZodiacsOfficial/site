  <style>
    :root {
      --bg: #0A0705; --bg-2: #0E0A07;
      --hair: rgba(210,167,78,0.10); --hair-2: rgba(210,167,78,0.22);
      --gold: #D2A74E; --gold-bright: #E9C766;
      --ink: #E8DEC4; --ink-2: #C9BDA1; --ink-dim: #988A6E; --ink-mute: #968860;
      --serif: 'Cormorant Garamond', 'EB Garamond', Georgia, Cambria, 'Times New Roman', serif;
      --mono: 'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Monaco, Consolas, monospace;
      --display: 'Cinzel', 'Cormorant Garamond', Georgia, serif;
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: radial-gradient(1200px 700px at 50% -10%, var(--bg-2), var(--bg) 60%);
      color: var(--ink); font-family: var(--serif); font-weight: 400;
      -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh;
      padding: 48px 24px; text-align: center;
    }
    .frame {
      max-width: 560px; width: 100%;
      border: 1px solid var(--hair);
      padding: clamp(36px, 7vw, 64px) clamp(24px, 6vw, 56px);
    }
    .label {
      font-family: var(--display); font-weight: 500; font-size: 9.5px;
      letter-spacing: 0.20em; text-transform: uppercase;
      color: var(--gold);
    }
    h1 {
      margin: 22px 0 0; font-weight: 400;
      font-size: clamp(30px, 6vw, 44px); line-height: 1.12;
      letter-spacing: -0.01em; color: var(--ink);
    }
    h1 .it { font-style: italic; color: var(--gold-bright); }
    .sub {
      margin: 16px auto 0; max-width: 40ch;
      font-size: 17px; line-height: 1.6; color: var(--ink-2);
    }
    .rule { margin: 30px auto 0; width: 56px; height: 1px; background: var(--hair-2); }
    nav {
      margin-top: 30px;
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 10px 22px;
    }
    nav a {
      font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--ink-dim); text-decoration: none;
      border-bottom: 1px solid var(--hair-2); padding-bottom: 3px;
      transition: color 320ms var(--ease), border-bottom-color 320ms var(--ease);
    }
    nav a:hover { color: var(--gold-bright); border-bottom-color: var(--gold); }
    footer {
      margin-top: 34px;
      font-family: var(--mono); font-size: 9px;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ink-mute);
    }
  </style>
