<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title description">
  <title id="title">Cancer constellation map</title>
  <desc id="description">Brighter stars in Cancer plotted from HYG Database J2000 coordinates. Praesepe is highlighted. Guide lines are not official constellation boundaries.</desc>
  <metadata>HYG Database v4.0, CC BY-SA 4.0, source blob 681f7d51024c9593182079da9fd1aec897a44e7e. Guide segments authored by Zodiacs.org.</metadata>
  <defs>
    <radialGradient id="field" cx="50%" cy="46%" r="66%"><stop offset="0" stop-color="#B6D4E4" stop-opacity=".08"/><stop offset="1" stop-color="#07080c" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="460" rx="28" fill="#090b10"/>
  <rect width="720" height="460" rx="28" fill="url(#field)"/>
  <g fill="none" stroke="#B6D4E4" stroke-opacity=".34" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">  <path d="M 447.92 402.00 L 329.90 244.38"/>
  <path d="M 329.90 244.38 L 321.47 58.00"/>
  <path d="M 329.90 244.38 L 272.08 355.04"/></g>
  <g fill="#eef1f7" fill-opacity=".86">  <circle class="star" cx="447.92" cy="402.00" r="2.67"/>
  <circle class="star" cx="329.90" cy="244.38" r="2.26"/>
  <circle class="star" cx="321.47" cy="58.00" r="2.17"/>
  <circle class="star" cx="272.08" cy="355.04" r="1.94"/>
  <g class="cluster" transform="translate(347.99 217.71)" aria-label="Praesepe open cluster"><circle r="10"/><circle class="cluster-dot" cx="-4" cy="-2" r="1.7"/><circle class="cluster-dot" cx="3" cy="-4" r="1.4"/><circle class="cluster-dot" cx="2" cy="4" r="1.5"/><circle class="cluster-dot" cx="-3" cy="5" r="1.1"/></g></g>
  <circle cx="347.99" cy="217.71" r="14" fill="none" stroke="#B6D4E4" stroke-width="1.5" stroke-opacity=".9" filter="url(#glow)"/>
  <text x="363.99" y="203.71" fill="#B6D4E4" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1.5">PRAESEPE</text>
  <text x="24" y="430" fill="#8e96ab" font-family="ui-monospace, monospace" font-size="9" letter-spacing="2">J2000 · EAST LEFT · CNC</text>
</svg>